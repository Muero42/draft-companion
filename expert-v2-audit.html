<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PITTI Expert-v2 Audit</title><style>body{font:16px system-ui;background:#0b1220;color:#eef2ff;max-width:760px;margin:auto;padding:18px}button{font:inherit;padding:12px 16px;border-radius:10px}pre{white-space:pre-wrap;background:#111827;padding:12px;border-radius:10px}.ok{color:#86efac}.bad{color:#fca5a5}</style><h1>PITTI Expert-v2 Audit</h1><p>Verwendet ausschließlich den bereits lokal gespeicherten FantasyPros-Zugang. Der Export enthält keine Zugangsdaten.</p><button id="run">Audit ausführen & JSON exportieren</button><pre id="status">Bereit.</pre><script>
const $=id=>document.getElementById(id),status=$('status');
const key=()=>localStorage.getItem('v7_apiKey')||'';
const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const field=(o,names)=>{for(const n of names){const k=Object.keys(o||{}).find(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'')===n.toLowerCase().replace(/[^a-z0-9]/g,''));if(k&&o[k]!==''&&o[k]!=null)return o[k]}return null};
const arrays=(v,d=0)=>d>5||v==null?[]:Array.isArray(v)?[v]:typeof v==='object'?Object.values(v).flatMap(x=>arrays(x,d+1)):[];
function expertsFrom(p){for(const rows of arrays(p).sort((a,b)=>b.length-a.length)){const m=rows.map(r=>{const id=field(r,['expert_id','expertid','id']),name=field(r,['expert_name','expertname','name','full_name']),site=field(r,['source','site_name','sitename','site']);return id&&name?{id:String(id),name:String(name),site:String(site||'')}:null}).filter(Boolean);if(m.length)return [...new Map(m.map(x=>[x.id,x])).values()]}return []}
async function fp(path){const r=await fetch('/api/fantasypros?path='+encodeURIComponent(path),{headers:{'x-fp-key':key()},cache:'no-store'}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error('FantasyPros-Proxy lieferte kein JSON: '+t.slice(0,120))}if(!r.ok)throw new Error(d?.error||d?.message||('HTTP '+r.status));return d}
function verifyFormat(d){const scoring=String(d?.scoring||d?.scoring_type||d?.scoring_name||'HALF').toUpperCase(),position=String(d?.position_id||d?.position||'ALL').toUpperCase(),type=String(d?.ranking_type_name||d?.ranking_type||d?.type||'DRAFT').toUpperCase();return{scoring,position,type,ok:scoring.includes('HALF')&&(position==='ALL'||position==='OVERALL')&&position!=='OP'&&!type.includes('SUPERFLEX')&&!type.includes('2QB')&&(type.includes('DRAFT')||type.includes('PRESEASON')||!type)}}
function rows(d){return (Array.isArray(d?.players)?d.players:[]).map(r=>{const id=String(field(r,['player_id','playerid','id'])||''),name=String(field(r,['player_name','playername','name','full_name'])||''),pos=String(field(r,['player_position_id','position_id','position','pos'])||'').toUpperCase().replace(/[0-9]/g,''),rank=Number(field(r,['rank_ecr','rank','overall_rank'])),tier=Number(field(r,['tier','rank_tier','tier_ecr']));return id&&name&&['QB','RB','WR','TE'].includes(pos)&&Number.isFinite(rank)&&rank>0?{id,name,pos,rank,tier:Number.isFinite(tier)&&tier>0?tier:null}:null}).filter(Boolean)}
async function single(e){const attempts=[`/nfl/2026/consensus-rankings?position=ALL&scoring=HALF&week=0&filters=${encodeURIComponent(e.id)}&experts=show`,`/nfl/2026/consensus-rankings?position=ALL&scoring=HALF&week=0&type=PRESEASON&filters=${encodeURIComponent(e.id)}&experts=show`,`/nfl/2026/consensus-rankings?position=ALL&scoring=HALF&week=0&type=DRAFT&filters=${encodeURIComponent(e.id)}&experts=show`];let last='';for(const path of attempts){try{const d=await fp(path),f=verifyFormat(d),rr=rows(d),names=d?.expert_name||{},pub=d?.expert_pub||{},ids=String(d?.filters??'').match(/\d+/g)||[],explicit=ids.includes(String(e.id))||Object.prototype.hasOwnProperty.call(names,String(e.id))||Object.prototype.hasOwnProperty.call(pub,String(e.id));if(f.ok&&Number(d?.total_experts)===1&&explicit&&rr.length>=80)return{name:e.name,id:e.id,site:e.site,status:'ok',path,format:f,lastUpdated:d?.last_updated??null,lastUpdatedTs:d?.last_updated_ts??null,expertPub:pub?.[String(e.id)]??pub??null,players:rr,tierCoverage:rr.filter(x=>x.tier!=null).length/rr.length};last=`format=${f.ok} total=${d?.total_experts} rows=${rr.length} explicit=${explicit}`}catch(err){last=err.message}}return{name:e.name,id:e.id,site:e.site,status:'error',error:last}}
async function external(name,site){try{const r=await fetch(`/api/expert-ranking?name=${encodeURIComponent(name)}&site=${encodeURIComponent(site)}&season=2026&scoring=HALF`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d?.error||('HTTP '+r.status));const rr=(d.players||[]).map(x=>{const id=String(field(x,['player_id','playerid','id'])||''),n=String(field(x,['player_name','playername','name','full_name'])||''),pos=String(field(x,['player_position_id','position_id','position','pos'])||'').toUpperCase().replace(/[0-9]/g,''),rank=Number(field(x,['rank_ecr','rank','overall_rank'])),tier=Number(field(x,['tier','rank_tier','tier_ecr']));return id&&n&&['QB','RB','WR','TE'].includes(pos)&&Number.isFinite(rank)&&rank>0?{id,name:n,pos,rank,tier:Number.isFinite(tier)&&tier>0?tier:null}:null}).filter(Boolean);return{name,site,status:rr.length>=80?'ok':'error',updated:d.updated??d.last_updated??null,source:d.source??null,players:rr,tierCoverage:rr.length?rr.filter(x=>x.tier!=null).length/rr.length:0}}catch(e){return{name,site,status:'error',error:e.message}}}
function save(o){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pitti-expert-v2-audit-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
$('run').onclick=async()=>{if(!key()){status.className='bad';status.textContent='Kein lokal gespeicherter FantasyPros-Zugang gefunden. Diese Seite muss auf demselben Ursprung wie die Draft-Companion-App geöffnet werden.';return}status.className='';status.textContent='Expertenverzeichnis …';const out={schema:'pitti-expert-v2-audit-v1',createdAt:new Date().toISOString(),season:2026,scoring:'HALF',format:'DRAFT/OVERALL/1QB',containsCredential:false,fp:[],external:[]};try{let dir=expertsFrom(await fp('/nfl/2026/rankings/experts?type=DRAFT&scoring=HALF&include_overall=true'));const targets=['Pat Fitzmaurice','Justin Boone','Sean Koerner','Nick Mariano','Dalton Del Don','Matt Harmon'];for(const n of targets){status.textContent='FantasyPros: '+n+' …';const e=dir.find(x=>norm(x.name)===norm(n));out.fp.push(e?await single(e):{name:n,status:'missing'})}status.textContent='RotoBaller/Mariano …';out.external.push(await external('Nick Mariano','RotoBaller'));status.textContent='Draft Sharks …';out.external.push(await external('Draft Sharks Team','Draft Sharks'));save(out);status.className='ok';status.textContent='Fertig. JSON wurde exportiert. Bitte diese Datei im PITTI-Chat teilen.'}catch(e){status.className='bad';status.textContent='Audit fehlgeschlagen: '+e.message}};
</script></html>
