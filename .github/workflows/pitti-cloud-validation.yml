name: PITTI cloud validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud-validation:
    name: pitti-cloud-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.2'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Install pinned project, Chromium and mandatory isolation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pitti-playwright
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo --preserve-env=PATH node tools/cloud-security-regression.mjs
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Complete exact-head cloud validation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pitti-playwright
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          sudo --preserve-env=PATH,EXPECTED_BASE,PLAYWRIGHT_BROWSERS_PATH,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT node tools/cloud-isolated-validation.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pitti-evidence-$EXPECTED_HEAD/validation"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pitti-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
