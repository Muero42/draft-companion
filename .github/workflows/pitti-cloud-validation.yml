name: PITTI cloud validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud-validation:
    name: pitti-cloud-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.2'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install pinned project and Chromium
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Complete exact-head cloud validation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node tools/cloud-validate.mjs "$RUNNER_TEMP/pitti-validation-$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pitti-validation-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
