name: Expert v2 Expanded Current Audit

on:
  push:
    branches:
      - pitti-rc464-expert-panel-v2-research
    paths:
      - research/EXPERT_V2_EXPANDED_AUDIT_TRIGGER.md

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current exact boards and rank correlations
        run: |
          python <<'PY'
          import re, urllib.request, html, math
          from collections import defaultdict
          candidates={
            'Michael Bobal':'michael-bobal',
            'Guilherme Gianni':'guilherme-gianni-',
            'Ryan Weisse':'ryan-weisse',
            'Pat Fitzmaurice':'pat-fitzmaurice',
            'Seth Miller':'seth-miller',
            'Jason Willan':'jason-willan',
            'Marc Shannep':'marc-shannep',
            'Jody Smith':'jody-smith',
            'Kevin Steele':'kevin-steele',
            'Joey Wright':'joey-wright'
          }
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PITTI-expanded-audit/1.0)','Accept':'text/html'})
            with urllib.request.urlopen(req,timeout=25) as r:return r.read().decode('utf-8','replace')
          def clean(x):return re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(x))).strip()
          def parse(text):
            out=[]
            for row in re.findall(r'<tr\b[^>]*>([\s\S]*?)</tr>',text,re.I):
              cells=[clean(x) for x in re.findall(r'<t[dh]\b[^>]*>([\s\S]*?)</t[dh]>',row,re.I)]
              if len(cells)<3: continue
              m=re.match(r'^\s*(\d{1,3})\b',cells[0]);
              if not m: continue
              rank=int(m.group(1)); name=''
              for attrs,body in re.findall(r'<a\b([^>]*)>([\s\S]*?)</a>',row,re.I):
                if '/nfl/players/' in attrs.lower():
                  name=clean(body); break
              if not name: continue
              pos=None
              for c in cells:
                pm=re.search(r'\b(QB|RB|WR|TE)\s*[-#]?\s*(\d+)?\b',c,re.I)
                if pm: pos=pm.group(1).upper(); break
              if pos: out.append((name,pos,rank))
            ded={}
            for x in out: ded.setdefault(x[0].lower(),x)
            return list(ded.values())
          def ranks(v):
            order=sorted(range(len(v)),key=lambda i:v[i]); r=[0]*len(v); i=0
            while i<len(order):
              j=i
              while j+1<len(order) and v[order[j+1]]==v[order[i]]: j+=1
              avg=(i+j+2)/2
              for k in range(i,j+1): r[order[k]]=avg
              i=j+1
            return r
          def spearman(a,b):
            common=sorted(set(a)&set(b))
            if len(common)<20:return None,len(common)
            x=ranks([a[k] for k in common]); y=ranks([b[k] for k in common]); n=len(common)
            mx=sum(x)/n; my=sum(y)/n
            num=sum((u-mx)*(v-my) for u,v in zip(x,y)); dx=sum((u-mx)**2 for u in x); dy=sum((v-my)**2 for v in y)
            return (num/math.sqrt(dx*dy) if dx and dy else None),n
          boards={}; meta={}
          for name,slug in candidates.items():
            url=f'https://www.fantasypros.com/nfl/rankings/{slug}.php?scoring=HALF&type=draft'
            try:
              t=fetch(url); plain=clean(t); rows=parse(t)
              updated=re.search(r'Rankings\s*-\s*([A-Z][a-z]{2,8}\s+\d{1,2},\s+2026)',plain,re.I)
              ok=bool(re.search(r'\b2026\b',plain) and re.search(r'Half Point PPR Rankings|Half PPR Rankings',plain,re.I) and re.search(r'Draft Rankings|Overall .*Rankings',plain,re.I) and len(rows)>=80)
              meta[name]=(len(rows),updated.group(1) if updated else '?',ok)
              if ok: boards[name]=rows
              print(f'SOURCE {name}: rows={len(rows)} updated={meta[name][1]} usable={ok}')
            except Exception as e: print(f'SOURCE {name}: ERROR {e}')
          print('\nPOSITION COUNTS')
          for n,b in boards.items():
            c=defaultdict(int)
            for _,p,_ in b:c[p]+=1
            print(n,dict(c))
          print('\nPAIRWISE SPEARMAN BY POSITION')
          names=sorted(boards)
          for pos in ['QB','RB','WR','TE']:
            print('POSITION',pos)
            maps={n:{nm.lower():r for nm,p,r in boards[n] if p==pos} for n in names}
            for i,a in enumerate(names):
              for b in names[i+1:]:
                rho,n=spearman(maps[a],maps[b])
                if rho is not None: print(f'{a} | {b}: rho={rho:.3f} n={n}')
          PY
