name: PITTI Bowers pick12 direct value diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/rc459_bowers_pick12_direct_value_2026.py'
      - '.github/workflows/pitti-bowers-pick12-direct-pr-trigger.yml'
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-decision-counterfactual-kernel
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact metadata-safe baseline audit shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base
          gh run download 32651366239 -D /tmp/base
      - name: Run Bowers pick12 direct value diagnostic
        run: python research/rc459_bowers_pick12_direct_value_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: pitti-bowers-pick12-direct-value
          path: diagnostics_2026/RC459_BOWERS_PICK12_DIRECT_VALUE_2026.json
          if-no-files-found: error
          retention-days: 7
