name: PITTI rc4.63 marginal-safety mechanism controls
on:
  push:
    branches: [pitti-rc463-safety-marginal-ab]
    paths:
      - research/rc463_marginal_safety_mechanism_controls_2026.js
      - .github/workflows/pitti-rc463-marginal-safety-controls.yml
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-rc463-safety-marginal-ab}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check research/rc463_marginal_safety_mechanism_controls_2026.js
      - run: node research/rc463_marginal_safety_mechanism_controls_2026.js
