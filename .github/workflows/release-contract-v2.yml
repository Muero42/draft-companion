name: PITTI release contract v2
on:
  push:
    branches: [main, pitti/expert-v4-v5-v180, pitti-rc4.137-tier-fix]
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  behavioral-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Syntax
        run: node --check app.js && node --check decision-policy.js && node --check live-surface-v3.js && node --check expert-v2-board.js && node --check expert-v3-board.js && node --check sw.js
      - name: Fail closed on hand-coded product prose
        run: |
          ! grep -q "PLAYER_EVIDENCE" live-surface-v3.js
          ! grep -q "JETZT-FENSTER\|EHER JETZT" live-surface-v3.js
      - name: Expert and UI contract
        run: |
          node tools/release-contract-v2.mjs
          node tools/runtime-startup-contract.mjs
          node tools/live-presentation-behavior.mjs
          node tools/season-bootstrap-runtime-regression.mjs
          node tools/season-interaction-e2e-gate.mjs
          node tools/season-startup-resilience-regression.mjs
          node tools/season-realshape-startup-e2e.mjs
          node tools/season-expert-phase-policy-regression.mjs
          node tools/season-lineup-waiver-routing-regression.mjs
          node tools/season-waiver-surface-ir-regression.mjs
          node tools/season-automatic-refresh-contract.mjs
          node tools/season-workspace-navigation-regression.mjs
          node tools/rc478-oos-policy.mjs
          PITTI_SKIP_SEAL_INTEGRITY=1 PITTI_CANDIDATE_PREFLIGHT=1 node tools/pitti_guardrail_check.mjs
          node tools/rc482-draft-critical.mjs
          node tools/rc483-draft-critical.mjs
          node tools/rc484-draft-critical.mjs
          node tools/rc485-draft-critical.mjs
          node tools/rc486-draft-critical.mjs
          node tools/rc487-draft-critical.mjs
          node tools/rc488-draft-critical.mjs
          node tools/rc489-draft-critical.mjs
          node tools/rc490-draft-critical.mjs
          node tools/rc491-return-calibration.mjs
          node tools/rc496-draft-critical.mjs
          node tools/rc4146-tier-payload-e2e.mjs
          node tools/rc4147-expert-directory-montgomery.mjs
          node tools/rc4148-tier-from-v4-panel.mjs
          node tools/rc4149-partial-v4-tier.mjs
          node tools/rc4150-global-v4-tier.mjs
          node tools/rc4151-live-controls-speed.mjs
          node tools/rc4152-live-manager-grid.mjs
          node tools/rc4153-expert-display-order.mjs
          if grep -q "v11.8.0-rc4.122" app.js; then node tools/rc4122-v45-runtime-contract.mjs; fi
          node tools/v4-embedded-coverage.mjs
          node tools/v3-v4-same-state-diagnostic.mjs

      - name: rc4.190 migration contracts
        run: |
          node tools/season-decision-engine-regression.mjs
          node tools/permission-contract-regression.mjs
          node tools/takeover-authority-regression.mjs
          node tools/postmerge-authority-regression.mjs

      - name: Independent runtime review and strict seal
        run: |
          node tools/season-adversarial-review-regression.mjs
          PITTI_SKIP_SEAL_INTEGRITY=0 PITTI_CANDIDATE_PREFLIGHT=0 node tools/pitti_guardrail_check.mjs
