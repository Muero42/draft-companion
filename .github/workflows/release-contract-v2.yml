name: PITTI release contract v2
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  behavioral-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Syntax
        run: node --check app.js && node --check decision-policy.js && node --check live-surface-v3.js && node --check expert-v2-board.js && node --check expert-v3-board.js && node --check sw.js
      - name: Fail closed on hand-coded product prose
        run: |
          ! grep -q "PLAYER_EVIDENCE" live-surface-v3.js
          ! grep -q "JETZT-FENSTER\|EHER JETZT" live-surface-v3.js
      - name: Expert and UI contract
        run: |
          node tools/release-contract-v2.mjs
          node tools/live-presentation-behavior.mjs
          node tools/rc478-oos-policy.mjs
          node tools/pitti_guardrail_check.mjs
          node tools/rc482-draft-critical.mjs
          node tools/rc483-draft-critical.mjs
          node tools/rc484-draft-critical.mjs
          node tools/rc485-draft-critical.mjs
          node tools/rc486-draft-critical.mjs
          node tools/rc487-draft-critical.mjs
          node tools/rc488-draft-critical.mjs
