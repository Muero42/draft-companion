name: PITTI decision counterfactual core
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'research/decision_counterfactual_core_2026.js'
      - 'research/decision_counterfactual_core_test_2026.js'
      - 'research/stateful_rng_2026.js'
      - 'research/stateful_rng_test_2026.js'
      - 'research/counterfactual_state_machine_test_2026.js'
      - 'research/DECISION_COUNTERFACTUAL_HARNESS_SPEC_2026-08-23.md'
      - '.github/workflows/pitti-decision-counterfactual-core.yml'
  workflow_dispatch:
jobs:
  invariant-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Counterfactual fail-closed invariants
        run: node research/decision_counterfactual_core_test_2026.js
      - name: Stateful RNG exact parity and branching
        run: node research/stateful_rng_test_2026.js
      - name: Snapshot branch resume state machine
        run: node research/counterfactual_state_machine_test_2026.js
