name: PITTI rc4.59 metadata collision audit
on:
  push:
    branches: [pitti-meta-collision-audit]
    paths:
      - 'research/rc459_metadata_collision_audit_2026.js'
      - '.github/workflows/pitti-rc459-metadata-collision-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-meta-collision-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check research/rc459_metadata_collision_audit_2026.js
      - name: Run collision audit
        run: node research/rc459_metadata_collision_audit_2026.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc459-metadata-collision-audit
          path: diagnostics_2026/RC459_METADATA_COLLISION_AUDIT_2026.json
          if-no-files-found: error
          retention-days: 7
      - name: Persist audit result on research branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics_2026/RC459_METADATA_COLLISION_AUDIT_2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record rc4.59 metadata collision audit [skip ci]'
            git pull --rebase origin pitti-meta-collision-audit
            git push origin HEAD:pitti-meta-collision-audit
          fi
