name: Historical rankings transport

on:
  push:
    branches:
      - pitti-auto/historical-validation-20260817
    paths:
      - .github/workflows/historical-rankings-transport.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch ffverse historical FantasyPros ranking data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p historical-rankings
          curl --fail --location --retry 3 --retry-delay 2 \
            --output historical-rankings/fp_rankings_history.rda \
            https://raw.githubusercontent.com/ffverse/ffsimulator/main/data/fp_rankings_history.rda
          curl --fail --location --retry 3 --retry-delay 2 \
            --output historical-rankings/fp_rankings_history_week.rda \
            https://raw.githubusercontent.com/ffverse/ffsimulator/main/data/fp_rankings_history_week.rda
          sha256sum historical-rankings/*.rda > historical-rankings/SHA256SUMS.txt
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Convert R data to CSV and schema report
        shell: Rscript {0}
        run: |
          dir.create("historical-rankings/csv", recursive = TRUE, showWarnings = FALSE)
          convert_one <- function(path, expected) {
            e <- new.env(parent = emptyenv())
            objs <- load(path, envir = e)
            cat("FILE:", path, "\nOBJECTS:", paste(objs, collapse=","), "\n")
            for (nm in objs) {
              x <- e[[nm]]
              cat("OBJECT:", nm, "CLASS:", paste(class(x), collapse=","), "DIM:", paste(dim(x), collapse="x"), "\n")
              if (is.data.frame(x)) {
                cat("COLUMNS:", paste(names(x), collapse=","), "\n")
                write.csv(x, file = file.path("historical-rankings/csv", paste0(nm, ".csv")), row.names = FALSE, na = "")
              }
            }
          }
          sink("historical-rankings/SCHEMA.txt")
          convert_one("historical-rankings/fp_rankings_history.rda", "fp_rankings_history")
          convert_one("historical-rankings/fp_rankings_history_week.rda", "fp_rankings_history_week")
          sink()
          print(readLines("historical-rankings/SCHEMA.txt"))
      - name: Upload historical ranking tables
        uses: actions/upload-artifact@v4
        with:
          name: ffverse-fantasypros-rankings-history
          path: historical-rankings/
          if-no-files-found: error
          retention-days: 7
