name: Freeze Expert v2 Exact Payload

on:
  push:
    branches:
      - pitti-rc464-expert-panel-v2-research
    paths:
      - research/FREEZE_EXPERT_V2_PAYLOAD_TRIGGER.md
  workflow_dispatch:

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and freeze exact current Half-PPR boards
        run: |
          python <<'PY'
          import re,urllib.request,html,json,hashlib,datetime,pathlib
          experts={
            'Ryan Weisse':'ryan-weisse',
            'Guilherme Gianni':'guilherme-gianni-',
            'Michael Bobal':'michael-bobal',
            'Pat Fitzmaurice':'pat-fitzmaurice'
          }
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PITTI-v2-freeze/1.0)','Accept':'text/html'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          def clean(x):return re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(x))).strip()
          def parse(text):
            out=[]
            for row in re.findall(r'<tr\b[^>]*>([\s\S]*?)</tr>',text,re.I):
              cells=[clean(x) for x in re.findall(r'<t[dh]\b[^>]*>([\s\S]*?)</t[dh]>',row,re.I)]
              if len(cells)<3:continue
              m=re.match(r'^\s*(\d{1,3})\b',cells[0])
              if not m:continue
              name=''
              for attrs,body in re.findall(r'<a\b([^>]*)>([\s\S]*?)</a>',row,re.I):
                if '/nfl/players/' in attrs.lower():name=clean(body);break
              if not name:continue
              pos=''
              for c in cells:
                pm=re.search(r'\b(QB|RB|WR|TE)\s*[-#]?\s*(\d+)?\b',c,re.I)
                if pm:pos=pm.group(1).upper();break
              if pos:out.append({'name':name,'pos':pos,'rank':int(m.group(1))})
            ded={}
            for x in out:ded.setdefault(x['name'].lower(),x)
            return sorted(ded.values(),key=lambda x:(x['rank'],x['name']))
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload={'schema':'pitti-expert-v2-exact-payload-v1','retrievedAt':now,'scoring':'HALF','season':2026,'experts':{}}
          manifest={'schema':'pitti-expert-v2-manifest-v1','retrievedAt':now,'scoring':'HALF','season':2026,'experts':{}}
          for name,slug in experts.items():
            url=f'https://www.fantasypros.com/nfl/rankings/{slug}.php?scoring=HALF&type=draft'
            text=fetch(url); plain=clean(text); rows=parse(text)
            dm=re.search(r'Rankings\s*-\s*([A-Z][a-z]{2,8}\s+\d{1,2},\s+2026)',plain,re.I)
            updated=dm.group(1) if dm else ''
            if len(rows)<80 or not updated:raise SystemExit(f'{name}: incomplete rows={len(rows)} updated={updated!r}')
            canonical=json.dumps(rows,sort_keys=True,separators=(',',':')).encode()
            sha=hashlib.sha256(canonical).hexdigest()
            payload['experts'][name]={'sourceUrl':url,'sourceUpdated':updated,'rowCount':len(rows),'sha256':sha,'rows':rows}
            manifest['experts'][name]={'sourceUrl':url,'sourceUpdated':updated,'rowCount':len(rows),'sha256':sha}
            print(f'{name}: rows={len(rows)} updated={updated} sha256={sha}')
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/expert-v2-exact-payload.json').write_text(json.dumps(payload,indent=2,sort_keys=True))
          pathlib.Path('artifacts/expert-v2-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True))
          PY
      - name: Validate frozen payload
        run: |
          python - <<'PY'
          import json,hashlib
          p=json.load(open('artifacts/expert-v2-exact-payload.json'))
          assert p['schema']=='pitti-expert-v2-exact-payload-v1' and p['scoring']=='HALF' and p['season']==2026
          assert set(p['experts'])=={'Ryan Weisse','Guilherme Gianni','Michael Bobal','Pat Fitzmaurice'}
          for n,e in p['experts'].items():
            assert e['rowCount']==len(e['rows'])>=80 and e['sourceUpdated']
            c=json.dumps(e['rows'],sort_keys=True,separators=(',',':')).encode()
            assert hashlib.sha256(c).hexdigest()==e['sha256']
          print('frozen v2 payload integrity PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expert-v2-exact-payload
          path: artifacts/expert-v2-exact-payload.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: expert-v2-manifest
          path: artifacts/expert-v2-manifest.json
          retention-days: 90
