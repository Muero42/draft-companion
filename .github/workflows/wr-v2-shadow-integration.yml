name: Draft Companion release completeness
'on':
  push:
    branches:
      - pitti-expert-v2-wr-decision-20260826
    paths:
      - '.github/workflows/wr-v2-shadow-integration.yml'
      - 'tools/release-completeness-guard.mjs'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'live-surface-v3.js'
      - 'expert-v2-board.js'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-expert-v2-wr-decision-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release completeness guard
        run: node tools/release-completeness-guard.mjs
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check live-surface-v3.js
          node --check expert-v2-board.js
          node --check sw.js
      - name: Existing decision regressions
        run: |
          node Draft_Companion_Position_Path_Regression_2026-08-13.js
          node Draft_Companion_Player_Quality_Expert_Health_Regression_2026-08-13.js
          node Draft_Companion_Return_Geometry_Market_Regression_2026-08-13.js
          node Draft_Companion_Scarcity_Double_Count_Regression_2026-08-13.js
          node Draft_Companion_Alternative_Scarcity_Regression_2026-08-13.js
          node Draft_Companion_Dress_Rehearsal_Regression_2026-08-14.js
      - name: Package verified runtime only
        run: |
          V=$(grep -o 'v11.8.0-rc4.[0-9]*' index.html | head -1)
          mkdir -p dist/runtime
          cp index.html app.js styles.css manifest.webmanifest sw.js _worker.js icon.svg live-surface-v3.js live-surface-v3.css expert-board-export.js expert-v2-board.js dist/runtime/
          (cd dist/runtime && zip -q ../Draft_Companion_${V}_VERIFIED_RUNTIME.zip *)
          test "$(unzip -Z1 dist/Draft_Companion_${V}_VERIFIED_RUNTIME.zip | wc -l)" -eq 11
          ! unzip -Z1 dist/Draft_Companion_${V}_VERIFIED_RUNTIME.zip | grep -E '(^|/)(tools|research|PITTI_|README|Regression|REGRESSION)'
          sha256sum dist/Draft_Companion_${V}_VERIFIED_RUNTIME.zip
      - uses: actions/upload-artifact@v4
        with:
          name: verified-runtime
          path: dist/Draft_Companion_*_VERIFIED_RUNTIME.zip
          retention-days: 7
