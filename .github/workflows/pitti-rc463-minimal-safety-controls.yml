name: PITTI rc4.63 minimal safety-guard mechanism controls
on:
  workflow_dispatch:
  push:
    branches: [pitti-rc463-roster-championship-v5-marginal]
    paths:
      - research/rc463_minimal_safety_guard_mechanism_controls_2026.js
      - .github/workflows/pitti-rc463-minimal-safety-controls.yml
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-rc463-roster-championship-v5-marginal}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check research/rc463_minimal_safety_guard_mechanism_controls_2026.js
      - run: node research/rc463_minimal_safety_guard_mechanism_controls_2026.js
