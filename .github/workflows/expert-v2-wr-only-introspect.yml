name: Expert-v2 WR-only introspect
on:
  push:
    branches: [pitti-expert-v2-wr-only-20260826]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact input and inspect WR-only fields
        shell: bash
        run: |
          set -euo pipefail
          base64 -d research/expert-v2-exact-return-input-v2.json.gz.b64 | gzip -dc > /tmp/input.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/input.json'))
          print('TOP_KEYS', sorted(d.keys()))
          print('POOL_N',len(d['pool']))
          for key in ['parkerwashington','stefondiggs','joshdowns','jordanaddison','jalencoker','xavierworthy','romeodoubs','mikewashington','jonahcoleman','kylermurray','justinherbert','tuckerkraft']:
              p=d['pool'].get(key)
              if p:
                  print('PLAYER',key,json.dumps(p,ensure_ascii=False,sort_keys=True))
          print('FIXTURE_SUMMARIES')
          for f in d['fixtures']:
              r=f['rosters'].get('9') or f['rosters'].get(9)
              print('STATE',f['current'],'NEXT',f['next'],'ROSTER',r,'AVAILABLE_N',len(f['available']),'RET_N',len(f.get('capturedReturn',{})),'OVERRIDES',f.get('overrides',{}))
          PY
