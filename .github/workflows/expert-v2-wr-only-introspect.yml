name: Expert-v2 WR decision gate
on:
  push:
    branches: [pitti-expert-v2-wr-decision-20260826]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact resolved Return probabilities
        run: node research/wr-v2-exact-return-harness.mjs
      - name: Compact WR rank and fixture map
        run: node research/wr-v2-decision-introspect.mjs
