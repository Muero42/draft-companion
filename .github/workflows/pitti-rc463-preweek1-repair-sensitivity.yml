name: PITTI rc4.63 pre-Week-1 repair sensitivity
on:
  push:
    branches: [pitti-rc463-roster-championship-v5-marginal]
    paths:
      - 'research/rc463_preweek1_repair_sensitivity_utility_2026.py'
      - '.github/workflows/pitti-rc463-preweek1-repair-sensitivity.yml'
permissions:
  contents: write
  actions: read
jobs:
  utility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-rc463-roster-championship-v5-marginal
      - name: Download exact paired rosters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/full /tmp/guard
          gh run download 32839901036 -D /tmp/full --pattern 'rc463-full-safety-baseline-*'
          gh run download 32832269866 -D /tmp/guard --pattern 'rc463-baseline-roster-*'
      - run: python -m py_compile research/rc463_preweek1_repair_sensitivity_utility_2026.py
      - run: python research/rc463_preweek1_repair_sensitivity_utility_2026.py
      - name: Persist result
        run: |
          git config user.name pitti-auto
          git config user.email pitti-auto@users.noreply.github.com
          git pull --rebase origin pitti-rc463-roster-championship-v5-marginal
          git add diagnostics_2026/RC463_PREWEEK1_REPAIR_SENSITIVITY_120_20260825.json
          if ! git diff --cached --quiet; then git commit -m 'research: persist pre-Week-1 repair sensitivity' && git push origin HEAD:pitti-rc463-roster-championship-v5-marginal; fi
