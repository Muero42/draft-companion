name: Roster Utility Diagnostic

on:
  push:
    branches:
      - pitti-rc464-expert-panel-v2-research
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show roster utility and scoring call sites
        run: |
          grep -n -B35 -A45 "function marginalRosterUtility" app.js || true
          echo '--- CALL SITES ---'
          grep -n -B20 -A30 "marginalRosterUtility(" app.js || true
          echo '--- RAW SCORE ---'
          grep -n -B35 -A50 "rawScore" app.js | head -n 220 || true
