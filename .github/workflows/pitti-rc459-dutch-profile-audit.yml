name: PITTI rc4.59 Dutch profile audit
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'research/rc459_dutch_profile_audit_2026.js'
      - '.github/workflows/pitti-rc459-dutch-profile-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/rc459_dutch_profile_audit_2026.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc459-dutch-profile-audit
          path: diagnostics_2026/RC459_DUTCH_PROFILE_AUDIT_2026.json
          if-no-files-found: error
