name: Apply Expert Panel v2 Freshness Gate

on:
  push:
    branches:
      - pitti-rc464-expert-panel-v2-research
    paths:
      - research/EXPERT_V2_FRESHNESS_GATE_TRIGGER.md

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app
        run: python tools/apply-v2-freshness-gate.py
      - name: Syntax
        run: node --check app.js
      - name: Invariants
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('app.js','utf8');for(const x of ['function expertSourceFreshness(','function v2ExpertEligible(','freshness-degraded','EXPIRED >5D'])if(!s.includes(x))throw new Error('missing '+x);const b=s.slice(s.indexOf(\"standard:{name:'Baseline\"),s.indexOf('// v2 current-source priors'));if(!b.includes('Derek Brown')||!b.includes('Andrew Erickson'))throw new Error('baseline drift');console.log('freshness invariants PASS')"
      - name: Isolated diff
        run: test "$(git diff --name-only)" = "app.js"
      - name: Commit
        run: |
          git config user.name "pitti-auto"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git commit -m "research: gate v2 expert sources by freshness" || exit 0
          git push
