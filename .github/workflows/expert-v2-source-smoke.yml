name: Expert v2 Source Smoke

on:
  push:
    branches:
      - pitti-rc464-expert-panel-v2-research
    paths:
      - research/EXPERT_V2_SOURCE_SMOKE_TRIGGER.md

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public 2026 Half-PPR draft sources
        run: |
          python <<'PY'
          import re, urllib.request, html
          candidates={
            'Michael Bobal':'michael-bobal',
            'Guilherme Gianni':'guilherme-gianni-',
            'Ryan Weisse':'ryan-weisse',
            'Sean Koerner':'sean-koerner',
            'Pat Fitzmaurice':'pat-fitzmaurice'
          }
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PITTI-source-smoke/1.0)','Accept':'text/html'})
            with urllib.request.urlopen(req,timeout=25) as r:return r.read().decode('utf-8','replace')
          def strip(s):return re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(s))).strip()
          def count_rows(text):
            n=0
            for row in re.findall(r'<tr\b[^>]*>([\s\S]*?)</tr>',text,re.I):
              if re.search(r'/nfl/players/',row,re.I) and re.search(r'<t[dh]\b[^>]*>\s*\d{1,3}\s*</t[dh]>',row,re.I):n+=1
            return n
          for name,slug in candidates.items():
            url=f'https://www.fantasypros.com/nfl/rankings/{slug}.php?scoring=HALF&type=draft'
            try:
              t=fetch(url); plain=strip(t); rows=count_rows(t)
              year=bool(re.search(r'\b2026\b',plain)); half=bool(re.search(r'Half Point PPR Rankings|Half PPR Rankings',plain,re.I)); draft=bool(re.search(r'Draft Rankings|Overall .*Rankings',plain,re.I))
              updated=re.search(r'Rankings\s*-\s*([A-Z][a-z]{2,8}\s+\d{1,2},\s+2026)',plain,re.I)
              print(f'{name}: rows={rows} context={year and half and draft} updated={updated.group(1) if updated else "?"} url={url}')
            except Exception as e: print(f'{name}: ERROR {e}')
          PY
