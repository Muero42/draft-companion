name: rc4.64 Expert Board Export V2 Package
on:
  push:
    branches: [pitti-rc464-board-export-v2-clean]
    paths:
      - 'expert-board-export.js'
      - '.github/workflows/rc464-board-export-v2-package.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point packaged runtime at fixed exporter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html','sw.js'):
              p=Path(name); s=p.read_text()
              old='expert-board-export.js?v=20260826d'
              new='expert-board-export.js?v=20260826e'
              if s.count(old)!=1: raise SystemExit(f'{name}: exporter anchor mismatch ({s.count(old)})')
              p.write_text(s.replace(old,new))
          PY
      - name: Syntax and semantic gates
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          node --check live-surface-v3.js
          node --check expert-board-export.js
          grep -q 'v11.8.0-rc4.64' app.js index.html sw.js live-surface-v3.js manifest.webmanifest README.md
          grep -q 'window.PITTI_LIVE_DECISION_STATE' app.js
          grep -q 'visibleCoachCandidates(c.scored)' app.js
          grep -q 'USER_HARD_QB_EXCLUSIONS' app.js
          grep -q 'DRAFT_ACUTE_STATUS_2026' app.js
          grep -q '10ER-ÜBERSICHT' live-surface-v3.js
          grep -q 'NORMAL-CUT WARNUNG' live-surface-v3.js
          grep -q 'expert-board-export.js?v=20260826e' index.html sw.js
          ! grep -q 'expert-board-export.js?v=20260826d' index.html sw.js
          grep -q 'PITTI_EXPERT_BOARDS_V3' expert-board-export.js
          grep -q 'source=PERSISTED_VERIFIED_APP_CACHE' expert-board-export.js
          grep -q 'credential=NONE' expert-board-export.js
          grep -q 'verifiedIndividual' expert-board-export.js
          grep -q 'schemaVersion' expert-board-export.js
          grep -q 'staleFallback' expert-board-export.js
          grep -q "v7_rank_" expert-board-export.js
          grep -q 'navigator.clipboard.writeText' expert-board-export.js
          ! grep -q '/api/fantasypros' expert-board-export.js
          ! grep -q 'getDir' expert-board-export.js
          ! grep -q 'localStorage.setItem.*apiKey' expert-board-export.js
          ! grep -q 'Derek Brown' expert-board-export.js
      - name: Verify isolated runtime diff
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/diff-files
          printf 'index.html\nsw.js\n' > /tmp/expected
          diff -u /tmp/expected /tmp/diff-files
          git diff -- app.js live-surface-v3.js live-surface-v3.css manifest.webmanifest README.md _worker.js styles.css
      - name: Package and verify
        run: |
          set -euo pipefail
          NAME=Draft_Companion_v11.8.0-rc4.64_EXPERT_BOARD_EXPORT_V2_TEST.zip
          zip -X -q "$NAME" README.md _worker.js app.js icon.svg index.html manifest.webmanifest styles.css sw.js live-surface-v3.js live-surface-v3.css expert-board-export.js
          unzip -t "$NAME"
          test "$(unzip -Z1 "$NAME" | wc -l)" -eq 11
          sha256sum "$NAME" > rc464-board-export-v2.sha256
          mkdir -p dist
          cp "$NAME" dist/
          cp rc464-board-export-v2.sha256 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Draft_Companion_v11.8.0-rc4.64_EXPERT_BOARD_EXPORT_V2_TEST
          path: |
            Draft_Companion_v11.8.0-rc4.64_EXPERT_BOARD_EXPORT_V2_TEST.zip
            rc464-board-export-v2.sha256
      - name: Publish direct-download package only
        run: |
          git restore index.html sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Draft_Companion_v11.8.0-rc4.64_EXPERT_BOARD_EXPORT_V2_TEST.zip dist/rc464-board-export-v2.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Publish rc4.64 expert board export v2 test package'
          git push
