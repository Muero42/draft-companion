name: finalize-rc4.52
on:
  workflow_dispatch:
  push:
    branches: [pitti-auto/finalization-rc4.52]
    paths:
      - tools/apply-finalization-runtime.mjs
      - .github/workflows/finalize-rc4.52.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-auto/finalization-rc4.52
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime generator syntax
        run: node --check tools/apply-finalization-runtime.mjs
      - name: Apply deterministic runtime patch
        run: node tools/apply-finalization-runtime.mjs
      - name: Syntax and contract gates
        run: |
          node --check app.js
          node --check _worker.js
          node --check sw.js
          node tests/live-draft-id-guard.test.js
          node tests/top10-candidate-visibility.test.js
          node tests/manager-live-adaptation.test.js
          node tests/manager-live-adaptation-regression.js
      - name: Commit generated runtime candidate
        run: |
          if git diff --quiet; then echo 'No runtime delta'; exit 0; fi
          git config user.name 'pitti-auto'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html manifest.webmanifest sw.js _worker.js README.md
          git commit -m 'Integrate rc4.52 LIVE guard and top-10 runtime UX'
          git push
