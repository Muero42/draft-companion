name: finalize-rc4.52
on:
  workflow_dispatch:
  push:
    branches: [pitti-auto/finalization-rc4.52]
    paths:
      - tools/apply-finalization-runtime.mjs
      - tools/apply-finalization-hardening.mjs
      - tests/finalization-release-readiness.test.js
      - .github/workflows/finalize-rc4.52.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-auto/finalization-rc4.52
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore deterministic rc4.50 runtime baseline
        run: |
          git checkout 9a57b03a36d1b7fa6658e27214c32c44275ff0ff -- app.js index.html manifest.webmanifest sw.js _worker.js README.md
      - name: Validate finalization scripts
        run: |
          set -o pipefail
          {
            node --check tools/apply-finalization-runtime.mjs
            node --check tools/apply-finalization-hardening.mjs
          } 2>&1 | tee /tmp/finalize-rc4.52.log
      - name: Apply deterministic runtime patch
        run: |
          set -o pipefail
          {
            node tools/apply-finalization-runtime.mjs
            node tools/apply-finalization-hardening.mjs
          } 2>&1 | tee -a /tmp/finalize-rc4.52.log
      - name: Syntax and contract gates
        run: |
          set -o pipefail
          {
            node --check app.js
            node --check _worker.js
            node --check sw.js
            node tests/live-draft-id-guard.test.js
            node tests/top10-candidate-visibility.test.js
            node tests/manager-live-adaptation.test.js
            node tests/manager-live-adaptation-regression.js
            node tests/finalization-release-readiness.test.js
          } 2>&1 | tee -a /tmp/finalize-rc4.52.log
      - name: Persist fail-closed diagnostic
        if: failure()
        run: |
          printf '%s\n' '=== finalize-rc4.52 fail-closed diagnostic ===' > tests/last-finalization-error.txt
          printf 'head=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> tests/last-finalization-error.txt
          if [ -f /tmp/finalize-rc4.52.log ]; then cat /tmp/finalize-rc4.52.log >> tests/last-finalization-error.txt; else echo 'No step log captured; failure occurred before diagnostic log creation.' >> tests/last-finalization-error.txt; fi
          git config user.name 'pitti-auto'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/last-finalization-error.txt
          git commit -m 'ci: persist rc4.52 fail-closed diagnostic' || exit 0
          git push
      - name: Commit generated runtime candidate
        run: |
          if ! git diff --quiet; then
            git config user.name 'pitti-auto'
            git config user.email 'actions@users.noreply.github.com'
            git add app.js index.html manifest.webmanifest sw.js _worker.js README.md
            git commit -m 'Integrate rc4.52 final draft-readiness runtime'
            git push
          fi
      - name: Build deterministic eight-file candidate
        run: |
          python - <<'PY'
          import zipfile
          files=['app.js','index.html','styles.css','manifest.webmanifest','sw.js','_worker.js','README.md','icon.svg']
          with zipfile.ZipFile('Draft_Companion_v11.8.0-rc4.52_FULL_TEST.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for path in files:
                  data=open(path,'rb').read()
                  info=zipfile.ZipInfo(path,(2026,8,19,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644 << 16
                  z.writestr(info,data)
          PY
          test "$(unzip -Z1 Draft_Companion_v11.8.0-rc4.52_FULL_TEST.zip | wc -l)" -eq 8
          unzip -t Draft_Companion_v11.8.0-rc4.52_FULL_TEST.zip
      - name: Persist successful candidate provenance
        run: |
          ZIP_SHA=$(sha256sum Draft_Companion_v11.8.0-rc4.52_FULL_TEST.zip | awk '{print $1}')
          RUNTIME_SHA=$(git rev-parse HEAD)
          printf '{\n  "status": "PASS",\n  "run_id": %s,\n  "trigger_sha": "%s",\n  "runtime_commit": "%s",\n  "zip_sha256": "%s",\n  "runtime_file_count": 8\n}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNTIME_SHA" "$ZIP_SHA" > tests/last-finalization-success.json
          git config user.name 'pitti-auto'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f tests/last-finalization-error.txt 2>/dev/null || true
          git add tests/last-finalization-success.json
          git commit -m 'ci: seal successful rc4.52 candidate provenance'
          git push
      - name: Upload rc4.52 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: Draft_Companion_v11.8.0-rc4.52_FULL_TEST
          path: Draft_Companion_v11.8.0-rc4.52_FULL_TEST.zip
          if-no-files-found: error
          retention-days: 14
