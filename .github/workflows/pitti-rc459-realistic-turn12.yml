name: PITTI rc4.59 realistic 1.09-2.02
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'research/rc459_realistic_turn12_2026.js'
      - '.github/workflows/pitti-rc459-realistic-turn12.yml'
  workflow_dispatch:
jobs:
  realistic-turn12:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Realistic 1.09 to 2.02 raw counterfactual
        run: node research/rc459_realistic_turn12_2026.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc459-realistic-turn12
          path: counterfactual_2026/RC459_REALISTIC_TURN12_2026.json
          if-no-files-found: error
