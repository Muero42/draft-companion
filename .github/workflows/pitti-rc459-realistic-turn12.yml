name: PITTI rc4.59 realistic 1.09-2.02
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'research/VERIFIED_LEAGUE_CONFIG_2026-08-23.json'
      - 'research/rc459_verified_league_reality_audit_2026.js'
      - 'research/rc459_realistic_turn12_2026.js'
      - 'research/rc459_realistic_turn12_reality_diagnostic_2026.js'
      - 'research/rc459_full_policy_paired_2026.js'
      - 'research/rc459_decision_counterfactual_screen_2026.js'
      - 'research/rc459_direct_2_02_regular_season_utility_2026.py'
      - 'app.js'
      - '.github/workflows/pitti-rc459-realistic-turn12.yml'
  workflow_dispatch:
jobs:
  realistic-turn12:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verified NFL Elite reality gate
        run: node research/rc459_verified_league_reality_audit_2026.js
      - name: Realistic 1.09 to 2.02 raw counterfactual
        run: node research/rc459_realistic_turn12_2026.js
      - name: Opponent-reach and faller-survival diagnostic
        run: node research/rc459_realistic_turn12_reality_diagnostic_2026.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc459-realistic-turn12
          path: |
            diagnostics_2026/RC459_VERIFIED_LEAGUE_REALITY_AUDIT_2026.json
            counterfactual_2026/RC459_REALISTIC_TURN12_2026.json
            counterfactual_2026/RC459_REALISTIC_TURN12_REALITY_DIAGNOSTIC_2026.json
          if-no-files-found: error
