name: package rc4.61
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '_worker.js'
      - 'app.js'
      - 'icon.svg'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'styles.css'
      - 'sw.js'
      - 'live-surface-v3.js'
      - 'live-surface-v3.css'
      - '.github/workflows/package-rc461.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify merged runtime
        run: |
          node --check app.js
          node --check sw.js
          node --check live-surface-v3.js
          grep -q "window.PITTI_LIVE_DECISION_STATE" app.js
          grep -q "id=\"liveDecisionSurfaceV3\"" index.html
          grep -q "id=\"analysisJumpV3\"" index.html
          grep -q "10ER-ÜBERSICHT" live-surface-v3.js
          grep -q "Pick-Confidence" live-surface-v3.js
          grep -q "AUSSERHALB NORMAL-CUT" live-surface-v3.js
          grep -q "Chat-Handoff kopieren" live-surface-v3.js
          grep -q "Full Diagnostic" live-surface-v3.js
          grep -q "USER_HARD_QB_EXCLUSIONS" app.js
          grep -q "DRAFT_ACUTE_STATUS_2026" app.js
          grep -q "v11.8.0-rc4.61" app.js index.html sw.js live-surface-v3.js
          grep -q "app.js?v=11.8.0-rc4.61" index.html sw.js
      - name: Package
        run: |
          zip -X -q Draft_Companion_v11.8.0-rc4.61_FULL_TEST.zip README.md _worker.js app.js icon.svg index.html manifest.webmanifest styles.css sw.js live-surface-v3.js live-surface-v3.css
          unzip -t Draft_Companion_v11.8.0-rc4.61_FULL_TEST.zip
          sha256sum Draft_Companion_v11.8.0-rc4.61_FULL_TEST.zip > rc461.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Draft_Companion_v11.8.0-rc4.61_FULL_TEST
          path: |
            Draft_Companion_v11.8.0-rc4.61_FULL_TEST.zip
            rc461.sha256