name: PITTI Utility v3 Certification
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-outcome-bridge-20250821}
      - name: Fetch independent inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o stats.csv https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv
          curl -fL --retry 3 -o picks.json https://api.sleeper.app/v1/draft/1225769229928648704/picks
          curl -fL --retry 3 -o ids.csv https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv
          curl -fL --retry 3 -o players.json https://api.sleeper.app/v1/players/nfl
          for w in $(seq 1 14); do curl -fsSL --retry 3 -o matchup_${w}.json https://api.sleeper.app/v1/league/1224396747309076480/matchups/${w}; done
      - name: Run Utility v3
        run: python research/independent_utility_v3_2025.py
      - name: Persist certification
        shell: bash
        run: |
          mkdir -p outcome_certification
          cp INDEPENDENT_UTILITY_V3_CERTIFICATION_2025.json outcome_certification/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outcome_certification/INDEPENDENT_UTILITY_V3_CERTIFICATION_2025.json
          git diff --cached --quiet && exit 0
          git commit -m 'Certify Independent Championship Utility v3 [skip ci]'
          git push origin HEAD:pitti-outcome-bridge-20250821
