name: PITTI rc4.64 minimal safety candidate dry-run
on:
  workflow_dispatch:
  push:
    branches: [pitti-rc464-minimal-safety-candidate]
    paths:
      - research/rc464_minimal_safety_transform.js
      - .github/workflows/pitti-rc464-minimal-safety-dryrun.yml
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-rc464-minimal-safety-candidate}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check research/rc464_minimal_safety_transform.js
      - run: node research/rc464_minimal_safety_transform.js
