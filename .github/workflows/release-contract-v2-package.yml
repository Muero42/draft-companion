name: PITTI candidate package gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Behavioral contract
        run: |
          node tools/release-contract-v2.mjs
          node tools/live-presentation-behavior.mjs
          node tools/release-completeness-guard.mjs
          node tools/rc478-oos-policy.mjs
          PITTI_SKIP_SEAL_INTEGRITY=1 PITTI_CANDIDATE_PREFLIGHT=1 node tools/pitti_guardrail_check.mjs
          node tools/rc482-draft-critical.mjs
          node tools/rc483-draft-critical.mjs
          node tools/rc484-draft-critical.mjs
          node tools/rc485-draft-critical.mjs
          node tools/rc486-draft-critical.mjs
          node tools/rc487-draft-critical.mjs
          node tools/rc488-draft-critical.mjs
          node tools/rc489-draft-critical.mjs
          node tools/rc490-draft-critical.mjs
          node tools/rc491-return-calibration.mjs
          node tools/rc496-draft-critical.mjs
          if grep -Eq "v11.8.0-rc4.(98|99|100)" app.js; then node tools/rc498-evidence-polarity.mjs; fi
          if grep -Eq "v11.8.0-rc4.(99|100)" app.js; then node tools/rc499-wr-saturation.mjs && node tools/rc499-normal-cut.mjs; fi
          if grep -q "v11.8.0-rc4.100" app.js; then node tools/rc4100-turn-portfolio.mjs; fi
          node tools/emergency-queue-contract.mjs
          node tools/pre-draft-freshness-gate.mjs --as-of=2026-08-28 --max-age-days=2
          node Draft_Companion_Position_Path_Regression_2026-08-13.js
          node Draft_Companion_Player_Quality_Expert_Health_Regression_2026-08-13.js
          node Draft_Companion_Return_Geometry_Market_Regression_2026-08-13.js
          node Draft_Companion_Scarcity_Double_Count_Regression_2026-08-13.js
          node Draft_Companion_Alternative_Scarcity_Regression_2026-08-13.js
          node Draft_Companion_Dress_Rehearsal_Regression_2026-08-14.js
      - name: Package then re-extract
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^const APP_VERSION='\([^']*\)'.*/\1/p" app.js | head -n1)"
          test -n "$VERSION"
          grep -q "$VERSION" index.html
          grep -q "$VERSION" sw.js
          grep -q "$VERSION" manifest.webmanifest
          PKG="Draft_Companion_${VERSION}_PREINSTALL.zip"
          rm -rf dist && mkdir -p dist/runtime dist/reextract
          cp index.html app.js decision-policy.js styles.css manifest.webmanifest sw.js _worker.js icon.svg live-surface-v3.js live-surface-v3.css expert-board-export.js expert-v2-board.js expert-v3-board.js dist/runtime/
          (cd dist/runtime && zip -q "../$PKG" *)
          test "$(unzip -Z1 "dist/$PKG" | wc -l)" -eq 13
          unzip -q "dist/$PKG" -d dist/reextract
          cd dist/reextract
          node --check app.js
          node --check decision-policy.js
          node --check live-surface-v3.js
          node --check expert-v2-board.js
          node --check expert-v3-board.js
          ! grep -q "PLAYER_EVIDENCE" live-surface-v3.js
          ! grep -q "JETZT-FENSTER\\|EHER JETZT" live-surface-v3.js
          grep -q "panelSelectable(x.r.panelId)" app.js
          grep -q "WR2 mit WR1-Upside" live-surface-v3.js
          cd ..
          sha256sum "$PKG" > candidate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Draft_Companion_PREINSTALL
          path: |
            dist/Draft_Companion_*_PREINSTALL.zip
            dist/candidate.sha256
