name: Apply Yahoo Expert Source Date

on:
  push:
    branches:
      - pitti-rc464-expert-panel-v2-research
    paths:
      - research/YAHOO_SOURCE_DATE_TRIGGER.md

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch worker provenance
        run: python tools/apply-yahoo-source-date.py
      - name: Syntax and contracts
        run: |
          node --check _worker.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'); const s=fs.readFileSync('_worker.js','utf8');
          for(const x of ['function sourceDateFromHtml(','updated:sourceDateFromHtml(html)'])if(!s.includes(x))throw new Error('missing '+x);
          const st=s.indexOf('function sourceDateFromHtml('), en=s.indexOf('function parseYahooSimpleOverall(',st);
          const ctx={Date}; vm.createContext(ctx); vm.runInContext(s.slice(st,en)+';globalThis.f=sourceDateFromHtml;',ctx);
          const samples=[
            ['<script type="application/ld+json">{"dateModified":"2026-08-24T15:12:00Z"}</script>','2026-08-24T15:12:00.000Z'],
            ['<meta property="article:published_time" content="2026-08-21T13:52:00+00:00">','2026-08-21T13:52:00.000Z'],
            ['<time datetime="2026-08-19T17:15:00Z">x</time>','2026-08-19T17:15:00.000Z']
          ];
          for(const [html,want] of samples){const got=ctx.f(html);if(got!==want)throw new Error(got+' != '+want)}
          console.log('Yahoo source-date parser PASS');
          NODE
      - name: Live Yahoo provenance marker smoke
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://ca.sports.yahoo.com/news/fantasy-football-rankings-consensus-top-300-players-160643696.html'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PITTI-source-date/1.0)'})
          text=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          pats=[r'"dateModified"\s*:\s*"([^"]+)"',r'"datePublished"\s*:\s*"([^"]+)"',r'article:published_time[^>]+content="([^"]+)"',r'<time[^>]+datetime="([^"]+)"']
          vals=[]
          for p in pats:
            m=re.search(p,text,re.I)
            if m: vals.append(m.group(1))
          if not vals: raise SystemExit('Yahoo page has no machine-readable date marker')
          print('Yahoo date marker:',vals[0])
          PY
      - name: Isolated runtime diff
        run: test "$(git diff --name-only)" = "_worker.js"
      - name: Commit worker patch
        run: |
          git config user.name "pitti-auto"
          git config user.email "actions@users.noreply.github.com"
          git add _worker.js
          git commit -m "research: preserve Yahoo expert source dates" || exit 0
          git push
