name: PITTI rc4.59 Dynamic Policy Gate
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-rc459-dynamic-policy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dynamic-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-outcome-bridge-20250821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run dynamic Coach gate
        run: node research/rc459_dynamic_policy_harness_2026.mjs
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          cp diagnostics_2026/RC459_DYNAMIC_POLICY_HARNESS_2026.json /tmp/full.json
          cp diagnostics_2026/RC459_DYNAMIC_POLICY_HARNESS_2026_GATE.json /tmp/gate.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard
          git clean -fd
          git fetch origin pitti-outcome-bridge-20250821
          git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p diagnostics_2026
          cp /tmp/full.json diagnostics_2026/RC459_DYNAMIC_POLICY_HARNESS_2026.json
          cp /tmp/gate.json diagnostics_2026/RC459_DYNAMIC_POLICY_HARNESS_2026_GATE.json
          git add diagnostics_2026/RC459_DYNAMIC_POLICY_HARNESS_2026*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record rc4.59 dynamic Coach gate [skip ci]'
            git push origin HEAD:pitti-outcome-bridge-20250821
          fi
