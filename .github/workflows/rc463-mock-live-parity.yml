name: rc4.63 Mock LIVE parity gate
on:
  push:
    branches: [pitti-auto/rc4.63-mock-live-parity]
    paths:
      - 'live-surface-v3.js'
      - 'live-surface-v3.css'
      - '.github/workflows/rc463-mock-live-parity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize rc4.63 release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['app.js','index.html','manifest.webmanifest','sw.js','README.md']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('v11.8.0-rc4.62','v11.8.0-rc4.63')
              if name in ('index.html','sw.js'):
                  s=s.replace('app.js?v=11.8.0-rc4.61','app.js?v=11.8.0-rc4.63')
              if name=='app.js':
                  s=s.replace("version:'11.8.0-rc4.60'","version:'11.8.0-rc4.63'")
              p.write_text(s)
          PY
      - name: JS syntax gates
        run: |
          node --check app.js
          node --check sw.js
          node --check live-surface-v3.js
      - name: Decision-state parity invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text()
          js=Path('live-surface-v3.js').read_text()
          css=Path('live-surface-v3.css').read_text()
          checks={
            'canonical_state_export':'window.PITTI_LIVE_DECISION_STATE' in app,
            'same_candidate_source':'visibleCoachCandidates(c.scored)' in app,
            'decision_first_top10':'source.slice(0,10)' in app,
            'surface_active_marker':'pitti-decision-surface-active' in js,
            'legacy_coach_hidden':'.pitti-decision-surface-active #coachSectionCard{display:none!important}' in css,
            'canonical_heading':'DRAFT-ENTSCHEIDUNG' in js,
            'top10':'10ER-ÜBERSICHT' in js,
            'normal_cut_warning':'NORMAL-CUT WARNUNG' in js,
            'return_is_timing':'Return ist Timing-Kennzahl, nicht allein das Draft-Fazit' in js,
            'hard_qb_exclusions':'USER_HARD_QB_EXCLUSIONS' in app,
            'acute_status_guard':'DRAFT_ACUTE_STATUS_2026' in app,
            'old_normal_cut_sort_absent':'const normal=source.filter(normalCandidateAdmissible)' not in app,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if failed: raise SystemExit('semantic invariant failure: '+', '.join(failed))
          PY
      - name: Version and cache coherence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names=['app.js','index.html','manifest.webmanifest','sw.js','live-surface-v3.js']
          data={n:Path(n).read_text() for n in names}
          required={
            'app.js':'v11.8.0-rc4.63',
            'index.html':'v11.8.0-rc4.63',
            'manifest.webmanifest':'v11.8.0-rc4.63',
            'sw.js':'v11.8.0-rc4.63',
            'live-surface-v3.js':'v11.8.0-rc4.63',
          }
          failed=[]
          for n,needle in required.items():
              ok=needle in data[n]
              print(('PASS ' if ok else 'FAIL ')+n+' contains rc4.63')
              if not ok: failed.append(n+':missing rc4.63')
          for n,s in data.items():
              if 'v11.8.0-rc4.62' in s:
                  print('FAIL '+n+' still contains rc4.62')
                  failed.append(n+':stale rc4.62')
          index=data['index.html']
          for needle in ['app.js?v=11.8.0-rc4.63','live-surface-v3.js?v=11.8.0-rc4.63','live-surface-v3.css?v=11.8.0-rc4.63']:
              ok=needle in index
              print(('PASS ' if ok else 'FAIL ')+'index cache '+needle)
              if not ok: failed.append('index:'+needle)
          if failed: raise SystemExit('version/cache coherence failure: '+', '.join(failed))
          PY
      - name: Package and verify runtime
        run: |
          zip -X -q Draft_Companion_v11.8.0-rc4.63_FULL_TEST.zip README.md _worker.js app.js icon.svg index.html manifest.webmanifest styles.css sw.js live-surface-v3.js live-surface-v3.css
          unzip -t Draft_Companion_v11.8.0-rc4.63_FULL_TEST.zip
          test "$(unzip -Z1 Draft_Companion_v11.8.0-rc4.63_FULL_TEST.zip | wc -l)" -eq 10
          sha256sum Draft_Companion_v11.8.0-rc4.63_FULL_TEST.zip > rc463.sha256
          cat rc463.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Draft_Companion_v11.8.0-rc4.63_FULL_TEST
          path: |
            Draft_Companion_v11.8.0-rc4.63_FULL_TEST.zip
            rc463.sha256
      - name: Commit synchronized candidate and direct package
        run: |
          mkdir -p dist
          cp Draft_Companion_v11.8.0-rc4.63_FULL_TEST.zip dist/
          cp Draft_Companion_v11.8.0-rc4.63_FULL_TEST.zip dist/PITTI-rc463.zip
          cp rc463.sha256 dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html manifest.webmanifest sw.js README.md dist/Draft_Companion_v11.8.0-rc4.63_FULL_TEST.zip dist/PITTI-rc463.zip dist/rc463.sha256
          git diff --cached --quiet && exit 0
          git commit -m "rc4.63: synchronize and package Mock LIVE parity candidate"
          git push
