name: PITTI Project Guardrails

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - pitti-guardrails-ci-20260826
    paths:
      - 'PITTI_EXECUTION_LOCK.json'
      - 'PITTI_CURRENT_STATE.json'
      - 'PITTI_HANDOFF_SEAL.json'
      - 'PITTI_PROJECT_STATE.md'
      - 'PITTI_AUTO_PREFLIGHT.md'
      - 'NEW_CHAT_HANDOFF_CURRENT.md'
      - 'HANDOFF_COMPLETENESS_MATRIX.md'
      - 'PITTI_NEW_CHAT_BOOTSTRAP.md'
      - 'PITTI_COMMAND_CONTRACTS.json'
      - 'README.md'
      - 'PITTI_RELEASE_CONTRACT_V2.md'
      - '.github/workflows/release-contract-v2.yml'
      - '.github/workflows/release-contract-v2-package.yml'
      - 'app.js'
      - 'decision-policy.js'
      - 'tools/analyze-decision-evidence.mjs'
      - 'tools/pitti_guardrail_check.mjs'
      - 'tools/pre-draft-freshness-gate.mjs'
      - 'tools/emergency-queue-contract.mjs'
      - 'tools/rc4100-turn-portfolio.mjs'
      - 'tools/rc4104-roster-portfolio.mjs'
      - 'tools/rc4106-embedded-individuals.mjs'
      - 'tools/rc4111-storage-quota.mjs'
      - 'tools/rc4112-mariano-source.mjs'
      - 'tools/rc4113-configured-expert-identity.mjs'
      - 'tools/rc4114-positional-expert-aggregation.mjs'
      - 'tools/rc4115-v5-hybrid.mjs'
      - 'tools/rc4117-release-critical.mjs'
      - '.github/workflows/pitti-project-guardrails.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node syntax
        run: node --check app.js
      - name: rc4.97 microfix contract
        if: contains(github.head_ref || github.ref_name, 'rc4.97-microfix')
        run: node tools/rc497-microfix.mjs
      - name: rc4.98 evidence polarity contract
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: |
          if grep -Eq "v11.8.0-rc4.(9[8-9]|1[0-9]{2,})" app.js; then node tools/rc498-evidence-polarity.mjs; fi
      - name: rc4.99 WR saturation contract
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: node tools/rc499-wr-saturation.mjs
      - name: rc4.99 normal-cut timing contract
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: node tools/rc499-normal-cut.mjs
      - name: rc4.104 roster portfolio contract
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: |
          node tools/rc4100-turn-portfolio.mjs
          if grep -Eq "v11.8.0-rc4.10[4-9]|v11.8.0-rc4.1[1-9][0-9]" app.js; then node tools/rc4104-roster-portfolio.mjs; fi
      - name: rc4.111 storage quota contract
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: |
          if grep -Eq "v11.8.0-rc4.11[1-9]|v11.8.0-rc4.1[2-9][0-9]" app.js; then node tools/rc4111-storage-quota.mjs; fi
      - name: rc4.112 Mariano source contract
        run: |
          if grep -Eq "v11.8.0-rc4.11[2-9]|v11.8.0-rc4.1[2-9][0-9]" app.js; then node tools/rc4112-mariano-source.mjs; fi
      - name: rc4.113 configured expert identity contract
        run: |
          if grep -Eq "v11.8.0-rc4.11[3-9]|v11.8.0-rc4.1[2-9][0-9]" app.js; then node tools/rc4113-configured-expert-identity.mjs; fi
      - name: rc4.114 positional expert aggregation contract
        run: |
          if grep -Eq "v11.8.0-rc4.11[4-9]|v11.8.0-rc4.1[2-9][0-9]" app.js; then node tools/rc4114-positional-expert-aggregation.mjs; fi
      - name: rc4.115 legacy v5 hybrid contract
        run: |
          if grep -q "v11.8.0-rc4.115" app.js; then node tools/rc4115-v5-hybrid.mjs; fi
      - name: rc4.117 release-critical contract
        run: |
          if grep -Eq "v11.8.0-rc4.11[7-9]|v11.8.0-rc4.1[2-9][0-9]" app.js; then node tools/rc4117-release-critical.mjs; fi
      - name: PITTI execution-lock and anti-regression gate
        env:
          PITTI_SKIP_SEAL_INTEGRITY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PITTI_CANDIDATE_PREFLIGHT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: node tools/pitti_guardrail_check.mjs
      - name: Runtime files are untouched by guardrail hardening
        if: github.ref_name == 'pitti-guardrails-ci-20260826'
        run: |
          git diff --exit-code 9ba6db89fc1e7550052a7526bd0c68d6cc7459dc -- app.js index.html sw.js manifest.webmanifest || {
            echo 'Guardrail hardening must not mutate Draft Companion runtime files.' >&2
            exit 1
          }
