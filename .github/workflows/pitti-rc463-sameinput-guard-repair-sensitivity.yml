name: PITTI rc4.63 same-input minimal-guard repair sensitivity
on:
  push:
    branches: [pitti-rc463-sameinput-guard-utility]
    paths:
      - '.github/workflows/pitti-rc463-sameinput-guard-repair-sensitivity.yml'
permissions:
  contents: write
  actions: read
jobs:
  utility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-rc463-sameinput-guard-utility
      - name: Wait for exact same-input roster run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess,time,os
          run=32866136332;repo=os.environ['GITHUB_REPOSITORY'];deadline=time.time()+2400
          while True:
            x=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']));print(x.get('status'),x.get('conclusion'),flush=True)
            if x.get('status')=='completed':
              if x.get('conclusion')!='success':raise SystemExit('source run failure '+str(x.get('conclusion')))
              break
            if time.time()>deadline:raise SystemExit('wait timeout')
            time.sleep(20)
          PY
      - name: Download and separate exact paired rosters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pair /tmp/full /tmp/guard
          gh run download 32866136332 -D /tmp/pair --pattern 'rc463-sameinput-full-guard-*'
          find /tmp/pair -name 'RC463_FULL_SAFETY_BASELINE_ROSTER_SHARD_*_2026.json' -exec cp {} /tmp/full/ \;
          find /tmp/pair -name 'RC463_BASELINE_ROSTER_SHARD_*_2026.json' -exec cp {} /tmp/guard/ \;
          test "$(find /tmp/full -type f | wc -l)" -eq 12
          test "$(find /tmp/guard -type f | wc -l)" -eq 12
      - run: python -m py_compile research/rc463_preweek1_repair_sensitivity_utility_2026.py
      - name: Run same-input repair sensitivity
        run: python research/rc463_preweek1_repair_sensitivity_utility_2026.py
      - name: Add same-input provenance
        run: |
          python - <<'PY'
          import json,glob,pathlib
          src=pathlib.Path('diagnostics_2026/RC463_PREWEEK1_REPAIR_SENSITIVITY_120_20260825.json');x=json.loads(src.read_text())
          ms=[]
          for p in glob.glob('/tmp/pair/**/RC463_SAMEINPUT_FULL_GUARD_MANIFEST_*_2026.json',recursive=True):ms.append(json.load(open(p)))
          if len(ms)!=12:raise SystemExit('manifest count '+str(len(ms)))
          hs={m['metadata_snapshot_sha256'] for m in ms}
          if len(hs)!=1:raise SystemExit('metadata hash drift '+repr(hs))
          x['comparison']='SAME-INPUT minimal guard minus full safety pre-Week-1 FA repair sensitivity: max one swap vs max two swaps'
          x['paired_roster_metadata_snapshot_sha256']=next(iter(hs));x['same_input_roster_generation']=True;x['source_run']=32866136332;x['promotion_authorized']=False
          dst=pathlib.Path('diagnostics_2026/RC463_SAMEINPUT_PREWEEK1_REPAIR_SENSITIVITY_120_20260825.json');dst.write_text(json.dumps(x,indent=2));print(json.dumps({k:v for k,v in x.items() if k!='rows'},indent=2))
          PY
      - name: Persist result
        run: |
          git config user.name pitti-auto
          git config user.email pitti-auto@users.noreply.github.com
          git pull --rebase origin pitti-rc463-sameinput-guard-utility
          git add diagnostics_2026/RC463_SAMEINPUT_PREWEEK1_REPAIR_SENSITIVITY_120_20260825.json
          if ! git diff --cached --quiet; then git commit -m 'research: persist same-input guard repair sensitivity' && git push origin HEAD:pitti-rc463-sameinput-guard-utility; fi
