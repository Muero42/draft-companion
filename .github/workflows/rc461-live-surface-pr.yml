name: rc4.61 live surface PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate in workspace
        run: |
          cp live-surface-v2.js live-surface.js
          cp live-surface-v2.css live-surface.css
          node tools/apply-rc461-live-surface.mjs
      - name: Verify locked surface and rc4.60 policy retention
        run: |
          node --check app.js
          node --check sw.js
          node --check live-surface.js
          grep -q "window.PITTI_LIVE_DECISION_STATE" app.js
          grep -q "id=\"liveDecisionSurface\"" index.html
          grep -q "id=\"snapshotJumpBtn\"" index.html
          grep -q "10ER-ÜBERSICHT" live-surface.js
          grep -q "Pick-Confidence" live-surface.js
          grep -q "AUSSERHALB NORMAL-CUT" live-surface.js
          grep -q "Chat-Handoff kopieren" live-surface.js
          grep -q "Full Diagnostic" live-surface.js
          grep -q "USER_HARD_QB_EXCLUSIONS" app.js
          grep -q "DRAFT_ACUTE_STATUS_2026" app.js
          grep -q "v11.8.0-rc4.61" app.js index.html sw.js live-surface.js
      - name: Package candidate
        run: |
          cp live-surface-v2.js live-surface.js
          cp live-surface-v2.css live-surface.css
          zip -X -q Draft_Companion_v11.8.0-rc4.61_FULL_TEST.zip README.md _worker.js app.js icon.svg index.html manifest.webmanifest styles.css sw.js live-surface.js live-surface.css
          unzip -t Draft_Companion_v11.8.0-rc4.61_FULL_TEST.zip