name: PITTI rc4.63 natural pick92 safety causal AB
on:
  workflow_dispatch:
  push:
    branches: [pitti-rc463-roster-championship-v5-marginal]
    paths:
      - research/rc463_natural_pick92_safety_ab_2026.js
      - .github/workflows/pitti-rc463-natural-pick92-safety-ab.yml
permissions:
  contents: write
jobs:
  causal-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-rc463-roster-championship-v5-marginal}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check research/rc463_natural_pick92_safety_ab_2026.js
      - run: node research/rc463_natural_pick92_safety_ab_2026.js
      - name: Persist causal A/B
        run: |
          git config user.name pitti-auto
          git config user.email pitti-auto@users.noreply.github.com
          git add diagnostics_2026/RC463_NATURAL_PICK92_SAFETY_AB_20260825.json
          if ! git diff --cached --quiet; then git commit -m 'research: persist natural pick92 safety causal AB' && git push origin HEAD:pitti-rc463-roster-championship-v5-marginal; fi
