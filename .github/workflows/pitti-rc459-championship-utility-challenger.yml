name: PITTI rc4.59 Championship Utility Challenger
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-rc459-championship-utility-challenger.yml'
      - 'research/rc459_dynamic_championship_utility_challenger_2026.py'
  workflow_dispatch:
concurrency:
  group: pitti-rc459-championship-utility-challenger
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  challenger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-outcome-bridge-20250821, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify prerequisites and run challenger
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/rc459_dynamic_championship_utility_challenger_2026.py
          python research/rc459_dynamic_championship_utility_challenger_2026.py | tee /tmp/champ-utility.log
      - name: Persist diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/champ-save && mkdir -p /tmp/champ-save/diagnostics_2026
          cp diagnostics_2026/RC459_DYNAMIC_CHAMPIONSHIP_UTILITY_CHALLENGER_2026*.json /tmp/champ-save/diagnostics_2026/
          cp /tmp/champ-utility.log /tmp/champ-save/diagnostics_2026/championship-utility-challenger.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard && git clean -fd
          git fetch origin pitti-outcome-bridge-20250821
          git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p diagnostics_2026 && cp -a /tmp/champ-save/diagnostics_2026/. diagnostics_2026/
          git add diagnostics_2026/
          if ! git diff --cached --quiet; then
            git commit -m 'Record rc4.59 championship utility challenger [skip ci]'
            git push origin HEAD:pitti-outcome-bridge-20250821
          fi
      - name: Report gate
        run: cat diagnostics_2026/RC459_DYNAMIC_CHAMPIONSHIP_UTILITY_CHALLENGER_2026_GATE.json
