name: PITTI QBTE paired complete-roster utility
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/rc459_qbte_paired_complete_roster_utility_2026.py'
      - '.github/workflows/pitti-qbte-paired-utility-pr-trigger.yml'
permissions:
  actions: read
  contents: read
jobs:
  utility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-meta-safe-qbte-guard-challenger
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact completed common-seed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base /tmp/chal
          gh run download 32651366239 -D /tmp/base
          gh run download 32651373236 -D /tmp/chal
          find /tmp/base /tmp/chal -type f -maxdepth 3 -print
      - name: Evaluate independent paired complete-roster utility
        run: python research/rc459_qbte_paired_complete_roster_utility_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: pitti-qbte-paired-complete-roster-utility
          path: diagnostics_2026/RC459_META_SAFE_QBTE_PAIRED_COMPLETE_ROSTER_UTILITY_2026.json
          if-no-files-found: error
          retention-days: 7
