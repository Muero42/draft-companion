name: PITTI Utility v3.5 + Fresh 2026 Freeze
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-utility-v3.yml'
      - 'research/independent_utility_v3_3_2025.py'
      - 'research/independent_utility_v3_5_2025.py'
      - 'research/freeze_2026_fetch.mjs'
      - 'research/yahoo_rank_probe.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-outcome-bridge-20250821}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch independent 2025 inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o stats.csv https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv
          curl -fL --retry 3 -o picks.json https://api.sleeper.app/v1/draft/1225769229928648704/picks
          curl -fL --retry 3 -o ids.csv https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv
          curl -fL --retry 3 -o players.json https://api.sleeper.app/v1/players/nfl
          for w in $(seq 1 14); do curl -fsSL --retry 3 -o matchup_${w}.json https://api.sleeper.app/v1/league/1224396747309076480/matchups/${w}; done
      - name: Run Utility v3.5
        continue-on-error: true
        run: python research/independent_utility_v3_5_2025.py
      - name: Acquire fresh 2026 panel and Sleeper ADP
        continue-on-error: true
        run: node research/freeze_2026_fetch.mjs
      - name: Probe unavailable Yahoo ranking sources
        continue-on-error: true
        run: node research/yahoo_rank_probe.mjs
      - name: Persist research outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outcome_certification freeze_2026
          if [ -f INDEPENDENT_UTILITY_V3_5_CERTIFICATION_2025.json ]; then cp INDEPENDENT_UTILITY_V3_5_CERTIFICATION_2025.json outcome_certification/; fi
          if [ -f FRESH_2026_MARKET_PANEL_RAW.json ]; then cp FRESH_2026_MARKET_PANEL_RAW.json freeze_2026/; fi
          if [ -f FRESH_2026_MARKET_PANEL_GATE.json ]; then cp FRESH_2026_MARKET_PANEL_GATE.json freeze_2026/; else printf '%s\n' '{"status":"RUNNER_ERROR","reason":"fresh 2026 acquisition produced no gate"}' > freeze_2026/FRESH_2026_MARKET_PANEL_GATE.json; fi
          if [ -f YAHOO_RANK_PROBE.json ]; then cp YAHOO_RANK_PROBE.json freeze_2026/; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outcome_certification/ freeze_2026/
          if ! git diff --cached --quiet; then git commit -m 'Record utility and fresh 2026 market freeze diagnostics [skip ci]'; git push origin HEAD:pitti-outcome-bridge-20250821; fi
      - name: Enforce gates
        run: |
          python - <<'PY'
          import json
          u=json.load(open('outcome_certification/INDEPENDENT_UTILITY_V3_5_CERTIFICATION_2025.json'))
          f=json.load(open('freeze_2026/FRESH_2026_MARKET_PANEL_GATE.json'))
          print('Utility v3.5:',u.get('status'),'Market freeze:',f.get('status'))
          if u.get('status')!='PASS' or f.get('status')!='PASS': raise SystemExit(2)
          PY
