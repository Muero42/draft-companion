name: PITTI Research Runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/jobs/current.json'
  pull_request:
    branches: [main]
    paths:
      - 'research/jobs/current.json'
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-outcome-bridge-20250821
      - name: Fetch independent inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o stats.csv https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv
          curl -fL --retry 3 -o picks.json https://api.sleeper.app/v1/draft/1225769229928648704/picks
          curl -fL --retry 3 -o ids.csv https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv
          curl -fL --retry 3 -o players.json https://api.sleeper.app/v1/players/nfl
          for w in $(seq 1 14); do curl -fsSL --retry 3 -o matchup_${w}.json https://api.sleeper.app/v1/league/1224396747309076480/matchups/${w}; done
      - name: Run Utility v3.2
        run: python research/independent_utility_v3_2025.py
      - name: Persist certification to results branch
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f INDEPENDENT_UTILITY_V3_CERTIFICATION_2025.json ]; then
            printf '%s\n' '{"status":"RUNNER_ERROR","reason":"certification output missing"}' > INDEPENDENT_UTILITY_V3_CERTIFICATION_2025.json
          fi
          mkdir -p /tmp/pitti-result/research/results
          cp INDEPENDENT_UTILITY_V3_CERTIFICATION_2025.json /tmp/pitti-result/research/results/utility_v3_2_latest.json
          cd /tmp/pitti-result
          git init
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin pitti-research-results || true
          if git show-ref --verify --quiet refs/remotes/origin/pitti-research-results; then git checkout -B pitti-research-results origin/pitti-research-results; else git checkout --orphan pitti-research-results; git rm -rf . 2>/dev/null || true; fi
          mkdir -p research/results
          cp /tmp/pitti-result/research/results/utility_v3_2_latest.json research/results/utility_v3_2_latest.json
          git add research/results/utility_v3_2_latest.json
          if ! git diff --cached --quiet; then git commit -m "Persist PITTI Utility v3.2 result"; git push origin HEAD:pitti-research-results; fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitti-utility-v3-2-certification
          path: INDEPENDENT_UTILITY_V3_CERTIFICATION_2025.json
          if-no-files-found: error
      - name: Enforce certification gate
        run: |
          python - <<'PY'
          import json
          x=json.load(open('INDEPENDENT_UTILITY_V3_CERTIFICATION_2025.json'))
          print('Utility v3.2:', x['status'])
          if x['status']!='PASS': raise SystemExit(2)
          PY
