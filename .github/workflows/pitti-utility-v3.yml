name: PITTI Fresh Freeze + Realistic Simulation Research
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-utility-v3.yml'
      - 'research/freeze_2026_fetch_v2.mjs'
      - 'research/augment_freeze_experts_2026.mjs'
      - 'research/finalize_freeze_2026.py'
      - 'research/policy_simulator_2026_realistic.py'
      - 'research/summarize_simulation_2026.py'
      - 'research/turn_pair_counterfactual_2026.py'
      - 'research/market_outcome_bridge_2026.py'
      - 'freeze_2026/FRESH_2026_HEALTH_ROLE_2026-08-22.json'
      - 'freeze_2026/FRESH_2026_STATIC_LAYERS_2026-08-22.json'
  workflow_dispatch:
concurrency:
  group: pitti-research-pipeline
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-outcome-bridge-20250821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install bridge dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Initialize clean run outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf simulation_2026 bridge_2026 diagnostics_2026
          mkdir -p simulation_2026 bridge_2026 diagnostics_2026 freeze_2026
          rm -f SIMULATION_2026_REALISTIC_RESULTS.json SIMULATION_2026_REALISTIC_GATE.json SIMULATION_2026_ROBUST_SUMMARY.json
          rm -f TURN_PAIR_COUNTERFACTUAL_2026.json TURN_PAIR_COUNTERFACTUAL_2026_GATE.json
          rm -f MARKET_OUTCOME_BRIDGE_2026.json MARKET_OUTCOME_BRIDGE_2026_GATE.json
          printf '{"run_id":"%s","source_sha":"%s","event":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" > diagnostics_2026/RUN_META.json
      - name: Verify closed Utility v3.5 gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='outcome_certification/INDEPENDENT_UTILITY_V3_5_CERTIFICATION_2025.json'
          x=json.load(open(p))
          print('Utility v3.5:',x.get('status'))
          if x.get('status')!='PASS': raise SystemExit(2)
          PY
      - name: Acquire fresh 2026 panel and Sleeper ADP
        shell: bash
        run: |
          set -o pipefail
          node research/freeze_2026_fetch_v2.mjs 2>&1 | tee diagnostics_2026/freeze_fetch.log
      - name: Apply Companion-parity Boone/Harmon reconstruction
        shell: bash
        run: |
          set -o pipefail
          node research/augment_freeze_experts_2026.mjs 2>&1 | tee diagnostics_2026/freeze_augment.log
      - name: Stage acquisition outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f FRESH_2026_MARKET_PANEL_RAW.json
          test -f FRESH_2026_MARKET_PANEL_GATE.json
          cp FRESH_2026_MARKET_PANEL_RAW.json freeze_2026/
          cp FRESH_2026_MARKET_PANEL_GATE.json freeze_2026/
      - name: Finalize complete fresh 2026 freeze
        shell: bash
        run: |
          set -o pipefail
          python research/finalize_freeze_2026.py 2>&1 | tee diagnostics_2026/freeze_finalize.log
      - name: Enforce refreshed freeze gate
        run: |
          python - <<'PY'
          import json
          f=json.load(open('freeze_2026/FRESH_2026_FREEZE_GATE.json'))
          print('Fresh 2026 freeze:',f.get('status'),f.get('package_sha256'))
          if f.get('status')!='PASS': raise SystemExit(2)
          PY
      - name: Compile research scripts
        shell: bash
        run: |
          python -m py_compile research/policy_simulator_2026_realistic.py research/summarize_simulation_2026.py research/turn_pair_counterfactual_2026.py research/market_outcome_bridge_2026.py
      - name: Scaled full-draft simulation suite
        shell: bash
        run: |
          set +e
          python research/policy_simulator_2026_realistic.py 2000 > diagnostics_2026/simulation.log 2>&1
          rc=$?
          cat diagnostics_2026/simulation.log
          if [ $rc -eq 0 ] && [ -f SIMULATION_2026_REALISTIC_RESULTS.json ] && [ -f SIMULATION_2026_REALISTIC_GATE.json ]; then
            cp SIMULATION_2026_REALISTIC_RESULTS.json simulation_2026/
            cp SIMULATION_2026_REALISTIC_GATE.json simulation_2026/
            python research/summarize_simulation_2026.py > diagnostics_2026/summary.log 2>&1
            src=$?
            cat diagnostics_2026/summary.log
            if [ $src -eq 0 ] && [ -f SIMULATION_2026_ROBUST_SUMMARY.json ]; then cp SIMULATION_2026_ROBUST_SUMMARY.json simulation_2026/; else printf '%s\n' '{"status":"RUNNER_ERROR","reason":"robust summary failed or missing"}' > simulation_2026/SIMULATION_2026_ROBUST_SUMMARY_GATE.json; fi
          else
            printf '{"status":"RUNNER_ERROR","reason":"scaled simulator failed","exit_code":%s}\n' "$rc" > simulation_2026/SIMULATION_2026_REALISTIC_GATE.json
          fi
          exit 0
      - name: Conditional turn-pair counterfactuals
        shell: bash
        run: |
          set +e
          python research/turn_pair_counterfactual_2026.py 250 > diagnostics_2026/turn_pair.log 2>&1
          rc=$?
          cat diagnostics_2026/turn_pair.log
          if [ $rc -eq 0 ] && [ -f TURN_PAIR_COUNTERFACTUAL_2026.json ] && [ -f TURN_PAIR_COUNTERFACTUAL_2026_GATE.json ]; then
            cp TURN_PAIR_COUNTERFACTUAL_2026.json simulation_2026/
            cp TURN_PAIR_COUNTERFACTUAL_2026_GATE.json simulation_2026/
          else
            printf '{"status":"RUNNER_ERROR","reason":"turn-pair simulator failed","exit_code":%s}\n' "$rc" > simulation_2026/TURN_PAIR_COUNTERFACTUAL_2026_GATE.json
          fi
          exit 0
      - name: Independent historical market-to-outcome bridge
        shell: bash
        run: |
          set +e
          python research/market_outcome_bridge_2026.py > diagnostics_2026/market_bridge.log 2>&1
          rc=$?
          cat diagnostics_2026/market_bridge.log
          if [ $rc -eq 0 ] && [ -f MARKET_OUTCOME_BRIDGE_2026.json ] && [ -f MARKET_OUTCOME_BRIDGE_2026_GATE.json ]; then
            cp MARKET_OUTCOME_BRIDGE_2026.json bridge_2026/
            cp MARKET_OUTCOME_BRIDGE_2026_GATE.json bridge_2026/
          else
            printf '{"status":"RUNNER_ERROR","reason":"market outcome bridge failed","exit_code":%s}\n' "$rc" > bridge_2026/MARKET_OUTCOME_BRIDGE_2026_GATE.json
          fi
          exit 0
      - name: Snapshot generated outputs only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pitti-persist
          mkdir -p /tmp/pitti-persist/freeze_2026 /tmp/pitti-persist/simulation_2026 /tmp/pitti-persist/bridge_2026 /tmp/pitti-persist/diagnostics_2026
          for f in FRESH_2026_MARKET_PANEL_RAW.json FRESH_2026_MARKET_PANEL_GATE.json FRESH_2026_PANEL_PAYLOAD.json FRESH_2026_SLEEPER_HALF_PPR_ADP_PAYLOAD.json FRESH_2026_FREEZE_GATE.json FRESH_2026_FREEZE_MANIFEST.json YAHOO_RANK_PROBE.json; do if [ -f "freeze_2026/$f" ]; then cp "freeze_2026/$f" /tmp/pitti-persist/freeze_2026/; fi; done
          cp -a simulation_2026/. /tmp/pitti-persist/simulation_2026/ || true
          cp -a bridge_2026/. /tmp/pitti-persist/bridge_2026/ || true
          cp -a diagnostics_2026/. /tmp/pitti-persist/diagnostics_2026/ || true
      - name: Persist without overwriting source manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard
          git clean -fd
          git fetch origin pitti-outcome-bridge-20250821
          git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p freeze_2026 simulation_2026 bridge_2026 diagnostics_2026
          cp -a /tmp/pitti-persist/freeze_2026/. freeze_2026/ || true
          rm -rf simulation_2026 bridge_2026 diagnostics_2026
          mkdir -p simulation_2026 bridge_2026 diagnostics_2026
          cp -a /tmp/pitti-persist/simulation_2026/. simulation_2026/ || true
          cp -a /tmp/pitti-persist/bridge_2026/. bridge_2026/ || true
          cp -a /tmp/pitti-persist/diagnostics_2026/. diagnostics_2026/ || true
          git add freeze_2026/ simulation_2026/ bridge_2026/ diagnostics_2026/
          if ! git diff --cached --quiet; then
            git commit -m 'Record fail-closed PITTI simulation research outputs [skip ci]'
            git push origin HEAD:pitti-outcome-bridge-20250821
          fi
      - name: Final gate summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for p in ['freeze_2026/FRESH_2026_FREEZE_GATE.json','simulation_2026/SIMULATION_2026_REALISTIC_GATE.json','simulation_2026/TURN_PAIR_COUNTERFACTUAL_2026_GATE.json','bridge_2026/MARKET_OUTCOME_BRIDGE_2026_GATE.json']:
              if pathlib.Path(p).exists():
                  x=json.load(open(p)); print(p, x.get('status'))
              else: print(p,'MISSING')
          PY
