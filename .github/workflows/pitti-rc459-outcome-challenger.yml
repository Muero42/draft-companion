name: PITTI rc4.59 Outcome Challenger
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-rc459-outcome-challenger.yml'
  workflow_dispatch:
concurrency:
  group: pitti-rc459-outcome-challenger
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  challenger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-outcome-bridge-20250821, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run observable challenger
        shell: bash
        run: |
          set +e
          python - <<'PY' >/tmp/verify.log 2>&1
          import json
          g=json.load(open('diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026_GATE.json'))
          assert g['status']=='PASS' and g['fixture_count']==16 and g['all_return_runs_900'] and g['all_input_rosters_exact']
          assert g['deterministic_repeatability'] and g['shadow_live_order_invariant']
          PY
          v=$?
          if [ $v -eq 0 ]; then python research/rc459_dynamic_outcome_challenger_2026.py >/tmp/challenger.log 2>&1; c=$?; else c=97; echo 'challenger skipped: dynamic gate verification failed' >/tmp/challenger.log; fi
          printf '{"verify_exit":%s,"challenger_exit":%s}\n' "$v" "$c" >/tmp/challenger-exit.json
          if [ ! -f diagnostics_2026/RC459_DYNAMIC_OUTCOME_CHALLENGER_2026_GATE.json ]; then printf '{"status":"FAIL_CLOSED","verify_exit":%s,"challenger_exit":%s,"policy_ranking_certified":false}\n' "$v" "$c" > diagnostics_2026/RC459_DYNAMIC_OUTCOME_CHALLENGER_2026_GATE.json; fi
          exit 0
      - name: Persist diagnostics always
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/challenger-save && mkdir -p /tmp/challenger-save
          for f in diagnostics_2026/RC459_DYNAMIC_OUTCOME_CHALLENGER_2026.json diagnostics_2026/RC459_DYNAMIC_OUTCOME_CHALLENGER_2026_GATE.json; do [ ! -f "$f" ] || cp "$f" /tmp/challenger-save/; done
          cp /tmp/verify.log /tmp/challenger.log /tmp/challenger-exit.json /tmp/challenger-save/
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard && git clean -fd && git fetch origin pitti-outcome-bridge-20250821 && git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p diagnostics_2026 && cp -a /tmp/challenger-save/. diagnostics_2026/
          git add diagnostics_2026/
          if ! git diff --cached --quiet; then git commit -m 'Record observable rc4.59 outcome challenger [skip ci]' && git push origin HEAD:pitti-outcome-bridge-20250821; fi
      - run: cat diagnostics_2026/RC459_DYNAMIC_OUTCOME_CHALLENGER_2026_GATE.json
