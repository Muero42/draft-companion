name: PITTI rc4.59 raw decision counterfactual screen
on:
  workflow_dispatch:
jobs:
  raw-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Raw direct decision counterfactuals
        run: node research/rc459_decision_counterfactual_screen_2026.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc459-decision-counterfactual-raw-screen
          path: counterfactual_2026/RC459_DECISION_COUNTERFACTUAL_RAW_SCREEN_2026.json
          if-no-files-found: ignore
