name: PITTI rc4.59 Sharded Full Policy Certification
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-rc459-full-policy-sharded.yml'
  workflow_dispatch:
concurrency:
  # Same group intentionally supersedes the slower monolithic full-policy run.
  group: pitti-rc459-full-policy-outcome
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-outcome-bridge-20250821}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          node --check research/rc459_full_policy_paired_2026.js
          node --check research/rc459_full_policy_shard_runner_2026.js
          python -m py_compile research/merge_rc459_full_policy_shards_2026.py research/rc459_full_policy_outcome_certification_2026.py
          python - <<'PY'
          import json
          for p in ['diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026_GATE.json','bridge_2026/MARKET_OUTCOME_BRIDGE_2026_GATE.json','outcome_certification/INDEPENDENT_UTILITY_V3_5_CERTIFICATION_2025.json','freeze_2026/FRESH_2026_FREEZE_GATE.json']:
              x=json.load(open(p)); assert x['status']=='PASS',(p,x.get('status'))
          PY
  shard:
    needs: preflight
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        offset: [0,10,20,30,40,50]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-outcome-bridge-20250821}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run disjoint paired shard
        shell: bash
        run: |
          set -o pipefail
          mkdir -p policy_certification_2026
          time node research/rc459_full_policy_shard_runner_2026.js 10 ${{ matrix.offset }} 2>&1 | tee shard-${{ matrix.offset }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: full-policy-shard-${{ matrix.offset }}
          path: |
            policy_certification_2026/RC459_FULL_POLICY_PAIRED_DRAFTS_2026_SHARD_*.json
            shard-${{ matrix.offset }}.log
          if-no-files-found: error
          retention-days: 3
  certify:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-outcome-bridge-20250821, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-policy-shard-*
          path: policy_shards
          merge-multiple: true
      - name: Merge and verify paired coverage
        shell: bash
        run: |
          set -o pipefail
          python research/merge_rc459_full_policy_shards_2026.py 2>&1 | tee /tmp/full-policy-merge.log
      - name: Independent championship outcome gate
        shell: bash
        run: |
          set -o pipefail
          time python research/rc459_full_policy_outcome_certification_2026.py 2>&1 | tee /tmp/full-policy-outcome.log
      - name: Persist canonical certification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/policy-save && mkdir -p /tmp/policy-save/policy_certification_2026 /tmp/policy-save/diagnostics_2026
          cp -a policy_certification_2026/. /tmp/policy-save/policy_certification_2026/ || true
          cp /tmp/full-policy-merge.log /tmp/policy-save/diagnostics_2026/full-policy-merge.log 2>/dev/null || true
          cp /tmp/full-policy-outcome.log /tmp/policy-save/diagnostics_2026/full-policy-outcome.log 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard && git clean -fd
          git fetch origin pitti-outcome-bridge-20250821
          git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p policy_certification_2026 diagnostics_2026
          cp -a /tmp/policy-save/policy_certification_2026/. policy_certification_2026/ || true
          cp -a /tmp/policy-save/diagnostics_2026/. diagnostics_2026/ || true
          git add policy_certification_2026/ diagnostics_2026/
          if ! git diff --cached --quiet; then
            git commit -m 'Record sharded rc4.59 full-policy certification [skip ci]'
            git push origin HEAD:pitti-outcome-bridge-20250821
          fi
      - name: Report gate
        if: always()
        run: |
          cat policy_certification_2026/RC459_FULL_POLICY_PAIRED_DRAFTS_2026_MERGE_GATE.json || true
          cat policy_certification_2026/RC459_FULL_POLICY_OUTCOME_CERTIFICATION_2026_GATE.json || true
