name: PITTI rc4.59 Dynamic Fixture Probe
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-rc459-dynamic-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-outcome-bridge-20250821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe fixture schemas
        run: python research/rc459_dynamic_fixture_probe_2026.py
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          cp diagnostics_2026/RC459_DYNAMIC_FIXTURE_SCHEMA_2026.json /tmp/schema.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard
          git clean -fd
          git fetch origin pitti-outcome-bridge-20250821
          git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p diagnostics_2026
          cp /tmp/schema.json diagnostics_2026/RC459_DYNAMIC_FIXTURE_SCHEMA_2026.json
          git add diagnostics_2026/RC459_DYNAMIC_FIXTURE_SCHEMA_2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record rc4.59 dynamic fixture schema [skip ci]'
            git push origin HEAD:pitti-outcome-bridge-20250821
          fi
