name: Historical market transport

on:
  push:
    branches:
      - pitti-auto/historical-validation-20260817
    paths:
      - .github/workflows/historical-market-transport.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch archived FantasyPros Half-PPR ADP pages and report client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p historical-market
          for year in 2021 2022 2023 2024; do
            url="https://www.fantasypros.com/nfl/adp/half-point-ppr-overall.php?year=${year}"
            echo "Fetching ${url}"
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "Mozilla/5.0" --output "historical-market/fantasypros_half_ppr_adp_${year}.html" "${url}"
          done
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "Mozilla/5.0" --output "historical-market/reports_bundle.js" "https://cdn.fantasypros.com/assets/js/min/pages/reports/bundle-b9fede7148ec22fb8959.js"
          sha256sum historical-market/* > historical-market/SHA256SUMS.txt
          ls -lh historical-market
      - name: Upload archived market pages
        uses: actions/upload-artifact@v4
        with:
          name: fantasypros-half-ppr-adp-2021-2024-with-client
          path: historical-market/
          if-no-files-found: error
          retention-days: 7
