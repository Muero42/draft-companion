name: PITTI rc4.63 v5 natural pick92 executable control
on:
  workflow_dispatch:
  push:
    branches: [pitti-rc463-roster-championship-v5-marginal]
    paths:
      - research/rc463_v5_natural_pick92_replay_2026.js
      - research/fixtures/rc463_natural_pick92_20260824.json
      - .github/workflows/pitti-rc463-v5-natural-pick92.yml
permissions:
  contents: write
jobs:
  natural-pick92:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-rc463-roster-championship-v5-marginal}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check research/rc463_v5_natural_pick92_replay_2026.js
      - name: Execute frozen natural pick92 control
        run: node research/rc463_v5_natural_pick92_replay_2026.js
      - name: Persist control result
        run: |
          git config user.name pitti-auto
          git config user.email pitti-auto@users.noreply.github.com
          git add diagnostics_2026/RC463_V5_NATURAL_PICK92_EXECUTABLE_CONTROL_20260825.json
          if ! git diff --cached --quiet; then git commit -m 'research: persist natural pick92 executable control' && git push origin HEAD:pitti-rc463-roster-championship-v5-marginal; fi
