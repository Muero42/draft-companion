name: PITTI rc4.59 Dynamic TE Screen
on:
  pull_request:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - 'research/jobs/dynamic-te-probe.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        variant: [TE_SOFT2, TE_SOFT4, TE_SOFT6, TE_RETURN_GATE, DEFER_TE69_ANCHOR]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-outcome-bridge-20250821
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run 10-seed/regime dynamic TE screen
        run: node research/rc459_dynamic_te_screen_2026.js ${{ matrix.variant }} 10
      - name: Roster/bye-aware diagnostic outcome
        shell: bash
        run: |
          cp policy_certification_2026/DYNAMIC_TE_${{ matrix.variant }}.json policy_certification_2026/RC459_FULL_POLICY_PAIRED_DRAFTS_2026.json
          python research/rc459_full_policy_outcome_certification_v2_2026.py > dynamic-te-${{ matrix.variant }}-outcome.log
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-te-${{ matrix.variant }}
          path: |
            policy_certification_2026/DYNAMIC_TE_${{ matrix.variant }}.json
            policy_certification_2026/RC459_FULL_POLICY_OUTCOME_CERTIFICATION_V2_2026_GATE.json
            dynamic-te-${{ matrix.variant }}-outcome.log
          if-no-files-found: error
          retention-days: 3
