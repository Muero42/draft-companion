name: PITTI rc4.59 verified league reality audit
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'research/VERIFIED_LEAGUE_CONFIG_2026-08-23.json'
      - 'research/rc459_verified_league_reality_audit_2026.js'
      - 'research/rc459_full_policy_paired_2026.js'
      - 'research/rc459_decision_counterfactual_screen_2026.js'
      - 'research/rc459_direct_2_02_regular_season_utility_2026.py'
      - 'app.js'
      - '.github/workflows/pitti-rc459-verified-league-reality-audit.yml'
  workflow_dispatch:
jobs:
  reality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed verified NFL Elite geometry audit
        run: node research/rc459_verified_league_reality_audit_2026.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc459-verified-league-reality-audit
          path: diagnostics_2026/RC459_VERIFIED_LEAGUE_REALITY_AUDIT_2026.json
          if-no-files-found: error
