name: PITTI rc4.63 pre-Week-1 repair-aware utility
on:
  push:
    branches: [pitti-rc463-roster-championship-v5-marginal]
    paths:
      - 'research/rc463_preweek1_repair_utility_2026.py'
      - '.github/workflows/pitti-rc463-preweek1-repair-utility.yml'
permissions:
  contents: write
  actions: read
jobs:
  utility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-rc463-roster-championship-v5-marginal
      - name: Wait for exact source runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess,time,os
          runs=[32839901036,32832269866];repo=os.environ['GITHUB_REPOSITORY'];deadline=time.time()+1800
          while True:
            st=[]
            for r in runs:
              x=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{r}']));st.append((r,x.get('status'),x.get('conclusion')))
            print(st,flush=True)
            if all(s=='completed' for _,s,_ in st):
              bad=[z for z in st if z[2]!='success']
              if bad:raise SystemExit('source run failure '+repr(bad))
              break
            if time.time()>deadline:raise SystemExit('wait timeout '+repr(st))
            time.sleep(20)
          PY
      - name: Download exact paired rosters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/full /tmp/guard
          gh run download 32839901036 -D /tmp/full --pattern 'rc463-full-safety-baseline-*'
          gh run download 32832269866 -D /tmp/guard --pattern 'rc463-baseline-roster-*'
      - name: Run syntax check
        run: python -m py_compile research/rc463_preweek1_repair_utility_2026.py
      - name: Run repair-aware utility
        run: python research/rc463_preweek1_repair_utility_2026.py
      - name: Persist result
        run: |
          git config user.name pitti-auto
          git config user.email pitti-auto@users.noreply.github.com
          git add diagnostics_2026/RC463_PREWEEK1_REPAIR_UTILITY_120_20260825.json
          if ! git diff --cached --quiet; then git commit -m 'research: persist pre-Week-1 repair-aware utility' && git push origin HEAD:pitti-rc463-roster-championship-v5-marginal; fi
