name: PITTI rc4.59 Opponent Kernel Parity
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-rc459-kernel.yml'
      - 'research/rc459_opponent_kernel_sim_2026.py'
      - 'research/rc459_opponent_kernel_baseline_2026.py'
  workflow_dispatch:
concurrency:
  group: pitti-rc459-kernel
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-outcome-bridge-20250821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify and mark start
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/rc459_opponent_kernel_sim_2026.py research/rc459_opponent_kernel_baseline_2026.py
          python - <<'PY'
          import json
          f=json.load(open('freeze_2026/FRESH_2026_FREEZE_GATE.json'));s=json.load(open('simulation_2026/SIMULATION_2026_REALISTIC_GATE.json'))
          if f.get('status')!='PASS' or s.get('status')!='PASS' or s.get('total_full_drafts')!=36000 or f.get('package_sha256')!=s.get('freeze_package_sha256'):raise SystemExit(2)
          PY
          mkdir -p diagnostics_2026
          printf '{"status":"STARTED","run_id":"%s","source_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > diagnostics_2026/RC459_KERNEL_START.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics_2026/RC459_KERNEL_START.json
          git commit -m 'Mark rc4.59 kernel parity run started [skip ci]' || true
          git pull --rebase origin pitti-outcome-bridge-20250821
          git push origin HEAD:pitti-outcome-bridge-20250821 || true
      - name: Run strict profiled baseline parity cell
        shell: bash
        run: |
          set +e
          python research/rc459_opponent_kernel_baseline_2026.py 2500 > /tmp/rc459_kernel.log 2>&1
          rc=$?
          cat /tmp/rc459_kernel.log
          if [ $rc -ne 0 ] || [ ! -f RC459_OPPONENT_KERNEL_BASELINE_2026_GATE.json ]; then
            printf '{"status":"RUNNER_ERROR","reason":"rc4.59 baseline kernel failed","exit_code":%s}\n' "$rc" > RC459_OPPONENT_KERNEL_BASELINE_2026_GATE.json
          fi
          exit 0
      - name: Persist parity outputs safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pitti-kernel
          mkdir -p /tmp/pitti-kernel/simulation_2026 /tmp/pitti-kernel/diagnostics_2026
          [ -f RC459_OPPONENT_KERNEL_BASELINE_2026.json ] && cp RC459_OPPONENT_KERNEL_BASELINE_2026.json /tmp/pitti-kernel/simulation_2026/ || true
          cp RC459_OPPONENT_KERNEL_BASELINE_2026_GATE.json /tmp/pitti-kernel/simulation_2026/
          cp /tmp/rc459_kernel.log /tmp/pitti-kernel/diagnostics_2026/rc459_kernel.log
          printf '{"run_id":"%s","source_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/pitti-kernel/diagnostics_2026/RC459_KERNEL_RUN_META.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard
          git clean -fd
          git fetch origin pitti-outcome-bridge-20250821
          git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p simulation_2026 diagnostics_2026
          cp -a /tmp/pitti-kernel/simulation_2026/. simulation_2026/
          cp -a /tmp/pitti-kernel/diagnostics_2026/. diagnostics_2026/
          git add simulation_2026/ diagnostics_2026/
          if ! git diff --cached --quiet; then git commit -m 'Record rc4.59 baseline opponent-kernel parity [skip ci]'; git push origin HEAD:pitti-outcome-bridge-20250821; fi
      - name: Report gate
        run: cat simulation_2026/RC459_OPPONENT_KERNEL_BASELINE_2026_GATE.json
