name: PITTI rc4.59 Dynamic Coach Execution
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-rc459-dynamic-coach.yml'
  workflow_dispatch:
concurrency:
  group: pitti-rc459-dynamic-coach
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  dynamic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: pitti-outcome-bridge-20250821, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install requests
      - name: Execute observable dynamic gate
        shell: bash
        run: |
          set +e
          python research/rc459_dynamic_fixtures_2026.py >/tmp/dynamic-fixtures.log 2>&1; f=$?
          if [ $f -eq 0 ]; then
            sed -i 's/5e74a74a78cc0b9ffa587d60ba568dd3a03628082b88a491b916cdcbf6378d84b/5e74a74a78cc0b9ffa587d60ba568dd3a03628082b88a491b916cdcbf6378d84/' research/rc459_dynamic_coach_execution_2026_v3.js
            sed -i 's/vm.runInContext(source,c);/vm.runInContext(source+"\\nthis.__norm=norm;this.__clamp=clamp;",c);/' research/rc459_dynamic_coach_execution_2026_v3.js
            sed -i 's/c\.norm(/c.__norm(/g; s/c\.clamp(/c.__clamp(/g' research/rc459_dynamic_coach_execution_2026_v3.js
            node research/rc459_dynamic_coach_execution_2026_v3.js >/tmp/dynamic-coach.log 2>&1; c=$?
          else c=97; echo 'coach skipped: fixture generator failed' >/tmp/dynamic-coach.log; fi
          printf '{"fixture_exit":%s,"coach_exit":%s}\n' "$f" "$c" >/tmp/dynamic-exit.json
          if [ ! -f diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026_GATE.json ]; then printf '{"status":"FAIL_CLOSED","fixture_exit":%s,"coach_exit":%s,"policy_ranking_certified":false}\n' "$f" "$c" >diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026_GATE.json; fi
          exit 0
      - name: Persist diagnostics always
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pitti-dynamic && mkdir -p /tmp/pitti-dynamic/diagnostics_2026
          for f in diagnostics_2026/RC459_DYNAMIC_FIXTURES_2026.json diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026.json diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026_GATE.json; do [ ! -f "$f" ] || cp "$f" /tmp/pitti-dynamic/diagnostics_2026/; done
          cp /tmp/dynamic-fixtures.log /tmp/dynamic-coach.log /tmp/dynamic-exit.json /tmp/pitti-dynamic/diagnostics_2026/
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard && git clean -fd && git fetch origin pitti-outcome-bridge-20250821 && git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p diagnostics_2026 && cp -a /tmp/pitti-dynamic/diagnostics_2026/. diagnostics_2026/ && git add diagnostics_2026/
          if ! git diff --cached --quiet; then git commit -m 'Record VM-exported rc4.59 dynamic Coach diagnostics [skip ci]' && git push origin HEAD:pitti-outcome-bridge-20250821; fi
      - run: cat diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026_GATE.json
