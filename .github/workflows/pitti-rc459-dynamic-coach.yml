name: PITTI rc4.59 Dynamic Coach Execution
on:
  push:
    branches: [pitti-outcome-bridge-20250821]
    paths:
      - '.github/workflows/pitti-rc459-dynamic-coach.yml'
  workflow_dispatch:
concurrency:
  group: pitti-rc459-dynamic-coach
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  dynamic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitti-outcome-bridge-20250821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Python dependency
        run: python -m pip install requests
      - name: Generate realistic fixtures
        run: python research/rc459_dynamic_fixtures_2026.py | tee /tmp/dynamic-fixtures.log
      - name: Execute exact rc4.59 Coach graph
        run: node research/rc459_dynamic_coach_execution_2026.js | tee /tmp/dynamic-coach.log
      - name: Persist outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pitti-dynamic && mkdir -p /tmp/pitti-dynamic/diagnostics_2026
          cp diagnostics_2026/RC459_DYNAMIC_FIXTURES_2026.json diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026.json diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026_GATE.json /tmp/pitti-dynamic/diagnostics_2026/
          cp /tmp/dynamic-fixtures.log /tmp/dynamic-coach.log /tmp/pitti-dynamic/diagnostics_2026/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard && git clean -fd
          git fetch origin pitti-outcome-bridge-20250821
          git checkout -B pitti-outcome-bridge-20250821 origin/pitti-outcome-bridge-20250821
          mkdir -p diagnostics_2026 && cp -a /tmp/pitti-dynamic/diagnostics_2026/. diagnostics_2026/
          git add diagnostics_2026/
          if ! git diff --cached --quiet; then
            git commit -m 'Record rc4.59 dynamic Coach execution [skip ci]'
            git push origin HEAD:pitti-outcome-bridge-20250821
          fi
      - name: Report gate
        run: cat diagnostics_2026/RC459_DYNAMIC_COACH_EXECUTION_2026_GATE.json
