name: draft-critical successor gate
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'live-surface-v3.js'
      - 'expert-v2-board.js'
      - 'expert-v3-board.js'
      - 'tools/rc496-draft-critical.mjs'
      - 'tools/rc497-microfix.mjs'
      - 'tools/rc498-evidence-polarity.mjs'
      - '.github/workflows/rc496-draft-critical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --check app.js && node --check live-surface-v3.js && node --check expert-v2-board.js && node --check tools/analyze-current-decision-evidence.mjs
      - run: node tools/rc496-draft-critical.mjs
      - name: successor microfix contracts when active
        run: |
          if grep -q "v11.8.0-rc4.97" app.js; then node tools/rc497-microfix.mjs; fi
          if grep -q "v11.8.0-rc4.98" app.js; then node tools/rc498-evidence-polarity.mjs; fi
